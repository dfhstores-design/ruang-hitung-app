        const attempt = data.attempt;
        const stats = data.topicStats || [];
        const isOpen = data.reviewUnlocked;
        const reviewMarkup = data.review ? reviewListMarkup(data.review, 'reviewer') : '<div class="empty-state"><strong>Pembahasan belum tersedia.</strong><p>Muat ulang data bila soal atau jawaban baru saja diperbarui.</p></div>';

        app.innerHTML = '<main id="main" tabindex="-1" class="app-shell narrow">' +
          topbarMarkup({ homeAction: 'back-dashboard' }) +
          '<div class="detail-hero">' +
            '<div><button type="button" class="text-button" data-action="back-dashboard">Kembali ke monitoring</button><h1>' + esc(attempt.packageTitle) + '</h1><p>' + esc(formatDateTime(attempt.submittedAt)) + ' · ' + esc(formatDuration(attempt.durationSec)) + '</p></div>' +
            '<div class="detail-score"><span class="number">' + esc(attempt.score) + '</span><span class="caption">dari 100 · ' + attempt.correctCount + ' benar</span></div>' +
          '</div>' +
          '<div class="dashboard-main">' +
            '<div class="action-panel">' +
              '<div><h2>' + (isOpen ? 'Pembahasan terbuka untuk siswa' : 'Pembahasan masih terkunci') + '</h2><p>' + (isOpen ? 'Siswa dapat membaca kunci dan langkah penyelesaian.' : 'Buka setelah siswa mengumpulkan dan siap meninjau jawabannya.') + '</p></div>' +
              '<button type="button" class="btn ' + (isOpen ? 'btn-secondary' : 'btn-primary') + '" data-action="toggle-review" data-attempt="' + esc(attempt.id) + '" data-unlock="' + (isOpen ? 'false' : 'true') + '">' + (isOpen ? 'Tutup pembahasan' : 'Buka pembahasan') + '</button>' +
            '</div>' +
            '<section aria-labelledby="stats-title" style="margin-bottom:30px">' +
              '<div class="section-title-row"><h2 id="stats-title">Ketepatan per topik</h2><p>Bagian dengan persentase rendah perlu diulang.</p></div>' +
              topicStatsMarkup(stats) +
            '</section>' +
            '<section aria-labelledby="answers-title">' +
              '<div class="section-title-row"><h2 id="answers-title">Jawaban dan pembahasan</h2><p>' + esc(attempt.totalQuestions) + ' soal · kunci jawaban terlihat oleh guru dan orang tua.</p></div>' +
              reviewMarkup +
            '</section>' +
          '</div>' +
          footerMarkup() +
        '</main>';
        focusMain();
      }

      function renderResult() {
        const data = state.result;
        if (!data) {
          state.view = 'dashboard';
          return renderDashboard();
        }
        const attempt = data.attempt;
        const canReview = data.canReview;
        const stats = data.topicStats || [];
        const percent = Math.max(0, Math.min(100, Number(data.score) || 0));
        const isTimeout = data.timeout === true;

        const lockedMarkup = !canReview ? '<div class="locked-panel">' +
          '<h2>Pembahasan masih terkunci.</h2>' +
          '<p>Skor dan jawabanmu sudah tersimpan. Kunci jawaban serta langkah penyelesaian akan terbuka setelah guru atau orang tua meninjaunya.</p>' +
          (data.reviewRequested
            ? '<p class="status-text is-waiting">Permintaan review sudah dikirim. Tunggu guru atau orang tua membuka pembahasan.</p>'
            : '<button type="button" class="btn btn-primary btn-small" data-action="request-review" data-attempt="' + esc(attempt.id) + '">Minta kunci pembahasan</button>') +
        '</div>' : '';

        const reviewMarkup = canReview ? '<section class="section-block" aria-labelledby="review-title">' +
          '<div class="section-title-row"><h2 id="review-title">Pembahasan soal</h2><p>Baca langkahnya, lalu coba jelaskan ulang dengan kata-katamu sendiri.</p></div>' +
          reviewListMarkup(data.review || [], 'student') +
        '</section>' : '';

        app.innerHTML = '<main id="main" tabindex="-1" class="app-shell narrow">' +
          topbarMarkup({ homeAction: 'back-dashboard' }) +
          (isTimeout ? '<div class="alert alert-info" role="status"><strong>Waktu habis.</strong><span>Jawaban yang sudah tersimpan dikumpulkan otomatis.</span></div>' : '') +
          '<div class="result-hero">' +
            '<div><div class="page-kicker"><span class="number">Hasil</span><span>' + esc(attempt.packageTitle) + '</span></div><h1>' + (data.score >= 80 ? 'Kerja yang kuat.' : data.score >= 60 ? 'Sudah ada fondasi.' : 'Ini titik mulai yang jelas.') + '</h1><p>Kamu menjawab benar ' + data.correctCount + ' dari ' + data.totalQuestions + ' soal. Lihat ketepatan per topik untuk menentukan langkah berikutnya.</p></div>' +
            '<div class="score-display"><span class="number">' + esc(data.score) + '</span><span class="out-of">dari 100</span></div>' +
          '</div>' +
          '<div class="dashboard-main">' +
            '<div class="score-bar" role="progressbar" aria-label="Skor latihan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percent + '"><span style="width:' + percent + '%"></span></div>' +
            '<div class="score-caption"><span>' + esc(formatDuration(data.durationSec)) + ' waktu pengerjaan</span><span>' + esc(formatDateTime(data.submittedAt)) + '</span></div>' +
            '<section class="section-block" aria-labelledby="stats-title">' +
              '<div class="section-title-row"><h2 id="stats-title">Ketepatan per topik</h2><p>Topik dengan batang pendek adalah prioritas review.</p></div>' +
              topicStatsMarkup(stats) +
            '</section>' +
            lockedMarkup +
            reviewMarkup +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:32px">' +
              '<button type="button" class="btn btn-primary" data-action="back-dashboard">Kembali ke ruang belajar</button>' +
            '</div>' +
          '</div>' +
          footerMarkup() +
        '</main>';
        focusMain();
      }

      function topicStatsMarkup(stats) {
        if (!stats.length) {
          return '<div class="empty-state"><strong>Belum ada rincian topik.</strong><p>Data topik akan muncul setelah soal dan jawaban terbaca.</p></div>';
        }
        return '<div class="topic-stats">' + stats.map(function (item) {
          const percent = Math.max(0, Math.min(100, Number(item.percent) || 0));
          return '<div class="topic-stat">' +
            '<span class="name">' + esc(item.topicName) + '</span>' +
            '<span class="value">' + item.correct + '/' + item.total + ' benar · ' + percent + '%</span>' +
            '<div class="bar" role="progressbar" aria-label="' + esc(item.topicName) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percent + '"><span style="width:' + percent + '%"></span></div>' +
          '</div>';
        }).join('') + '</div>';
      }

      function reviewListMarkup(review, mode) {
        if (!review.length) {
          return '<div class="empty-state"><strong>Belum ada pembahasan.</strong><p>Soal untuk latihan ini belum tersedia di bank soal.</p></div>';
        }
        return '<div class="review-list">' + review.map(function (item) {
          const verdict = item.selectedIndex == null ? 'Tidak dijawab' : item.isCorrect ? 'Benar' : 'Salah';
          const verdictClass = item.isCorrect ? 'correct' : 'wrong';
          const options = item.options.map(function (option, index) {
            let className = 'review-option';
            let tags = '';
            if (index === item.correctIndex) {
              className += ' is-correct';
              tags += '<span class="option-tag">Kunci</span>';
            }
            if (index === item.selectedIndex && index !== item.correctIndex) {
              className += ' is-selected-wrong';
              tags += '<span class="option-tag">Jawabanmu</span>';
            } else if (index === item.selectedIndex) {
              tags += '<span class="option-tag">Jawabanmu</span>';
            }
            return '<div class="' + className + '">' +
              '<span class="letter">' + String.fromCharCode(65 + index) + '</span>' +
              '<span>' + esc(option) + tags + '</span>' +
            '</div>';
          }).join('');

          return '<details class="review-item">' +
            '<summary>' +
              '<span class="review-number">' + item.number + '</span>' +
              '<span class="review-summary-text"><strong>' + esc(item.question) + '</strong><span>' + esc(item.topicName) + ' · ' + esc(item.difficulty) + '</span></span>' +
              '<span class="review-verdict ' + verdictClass + '">' + verdict + '</span>' +
            '</summary>' +
            '<div class="review-body">' +
              '<div class="review-question">' + esc(item.question) + '</div>' +
              '<div class="review-options">' + options + '</div>' +
              '<div class="solution"><strong>Langkah penyelesaian</strong>' + textBlock(item.solution) + '</div>' +
            '</div>' +
          '</details>';
        }).join('') + '</div>';
      }

      function renderQuiz() {
        if (!state.attempt || !state.questions.length) {
          state.view = 'dashboard';
          return renderDashboard();
        }
        const attempt = state.attempt;
        const questions = state.questions;
        const index = Math.min(Math.max(0, state.index), questions.length - 1);
        const question = questions[index];
        const selected = state.answers[question.id];
        const answeredCount = Object.keys(state.answers).length;
        const progress = Math.round((answeredCount / questions.length) * 100);
        const isFirst = index === 0;
        const isLast = index === questions.length - 1;

        const options = question.options.map(function (option, optionIndex) {
          const isSelected = selected === optionIndex;
          return '<label class="answer-option' + (isSelected ? ' is-selected' : '') + '">' +
            '<input type="radio" name="answer" value="' + optionIndex + '" data-answer="' + esc(question.id) + '"' + (isSelected ? ' checked' : '') + '>' +
            '<span class="option-letter">' + String.fromCharCode(65 + optionIndex) + '</span>' +
            '<span class="option-text">' + esc(option) + '</span>' +
          '</label>';
        }).join('');

        const mapButtons = questions.map(function (q, i) {
          const answered = Object.prototype.hasOwnProperty.call(state.answers, q.id);
          return '<button type="button" class="map-button' + (answered ? ' is-answered' : '') + (i === index ? ' is-current' : '') + '" data-action="jump-question" data-index="' + i + '">' + (i + 1) + '</button>';
        }).join('');

        app.innerHTML = '<main id="main" tabindex="-1" class="app-shell">' +
          '<div class="quiz-shell">' +
            '<div class="quiz-top">' +
              '<div class="quiz-top-row">' +
                '<div class="quiz-label"><strong>' + esc(attempt.packageTitle) + '</strong> · soal ' + (index + 1) + ' dari ' + questions.length + '</div>' +
                '<div class="timer" id="timer" role="timer" aria-live="off"><span class="timer-note">Sisa</span><span id="timer-value">' + formatClock(remainingSeconds()) + '</span></div>' +
              '</div>' +
              '<div class="progress-track" role="progressbar" aria-label="Soal terjawab" aria-valuemin="0" aria-valuemax="' + questions.length + '" aria-valuenow="' + answeredCount + '"><span style="width:' + progress + '%"></span></div>' +
            '</div>' +
            '<article class="quiz-card" aria-labelledby="question-text">' +
              '<div class="question-meta"><span class="question-number">Soal ' + (index + 1) + '</span><span>' + esc(question.topicName) + ' · ' + esc(question.difficulty) + '</span></div>' +
              '<h1 class="question-text" id="question-text">' + esc(question.question) + '</h1>' +
              '<fieldset class="answer-list"><legend class="sr-only">Pilih satu jawaban</legend>' + options + '</fieldset>' +
              '<div class="quiz-save-status"><span id="save-status" aria-live="polite">' + (selected != null ? 'Jawaban tersimpan di perangkat ini.' : 'Pilih satu jawaban.') + '</span><span>' + answeredCount + ' dari ' + questions.length + ' terjawab</span></div>' +
            '</article>' +
            '<div class="quiz-footer">' +
              '<div class="quiz-footer-group">' +
                '<button type="button" class="btn btn-ghost btn-small" data-action="quiz-exit">Keluar</button>' +
                '<button type="button" class="btn btn-secondary btn-small" data-action="quiz-map">Daftar soal</button>' +
              '</div>' +
              '<div class="quiz-footer-group">' +
                '<button type="button" class="btn btn-secondary" data-action="quiz-prev"' + (isFirst ? ' disabled' : '') + '>Sebelumnya</button>' +
                (isLast
                  ? '<button type="button" class="btn btn-primary" data-action="quiz-submit">Kumpulkan</button>'
                  : '<button type="button" class="btn btn-primary" data-action="quiz-next">Berikutnya</button>') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<dialog class="modal" id="question-dialog" aria-labelledby="map-title">' +
            '<div class="modal-inner">' +
              '<h2 id="map-title">Daftar soal</h2>' +
              '<p>Soal yang sudah dijawab ditandai. Pilih nomor untuk berpindah.</p>' +
              '<div class="question-map">' + mapButtons + '</div>' +
              '<div class="map-legend"><span><i class="answered"></i>Sudah dijawab</span><span><i></i>Belum dijawab</span></div>' +
              '<div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-map">Tutup</button><button type="button" class="btn btn-primary" data-action="quiz-submit">Kumpulkan</button></div>' +
            '</div>' +
          '</dialog>' +
        '</main>';

        ensureTimer();
        updateTimerDisplay();
        focusMain();
      }

      function remainingSeconds() {
        if (!state.timerEnd) return 0;
        return Math.max(0, Math.floor((state.timerEnd - Date.now()) / 1000));
      }

      function ensureTimer() {
        if (state.timerId) return;
        state.timerId = window.setInterval(function () {
          updateTimerDisplay();
          if (remainingSeconds() <= 0) {
            window.clearInterval(state.timerId);
            state.timerId = null;
            autoSubmit();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const timer = document.getElementById('timer');
        const value = document.getElementById('timer-value');
        if (!timer || !value) return;
        const left = remainingSeconds();
        value.textContent = formatClock(left);
        timer.classList.toggle('is-urgent', left <= 300);
        if (left <= 300) {
          timer.setAttribute('aria-label', 'Sisa waktu ' + formatClock(left) + ', waktu hampir habis');
        } else {
          timer.setAttribute('aria-label', 'Sisa waktu ' + formatClock(left));
        }
      }

      async function loadDashboard(options) {
        const opts = options || {};
        try {
          const data = await api('getDashboard', state.token);
          state.dashboard = data;
          state.role = data.role;
          state.view = 'dashboard';
          render();
        } catch (error) {
          if (/sesi/i.test(error.message)) {
            clearSession();
            state.loginMessage = 'Sesi berakhir. Masuk kembali dengan kode akses.';
            state.view = 'login';
            render();
            return;
          }
          if (opts.silent) {
            showToast(error.message, 'error');
            return;
          }
          state.bootError = error.message;
          state.view = 'error';
          render();
        }
      }

      async function boot() {
        applyTheme(state.theme);
        if (!state.token) {
          state.view = 'login';
          render();
          return;
        }
        renderBoot();
        try {
          const data = await api('getDashboard', state.token);
          state.dashboard = data;
          state.role = data.role;
          state.view = 'dashboard';
          render();
        } catch (error) {
          clearSession();
          state.loginMessage = /sesi/i.test(error.message)
            ? 'Sesi berakhir. Masuk kembali dengan kode akses.'
            : '';
          state.view = 'login';
          render();
        }
      }

      function clearSession() {
        state.token = null;
        state.dashboard = null;
        state.attempt = null;
        state.questions = [];
        state.answers = {};
        state.result = null;
        state.detail = null;
        storage.remove(SESSION_KEY);
        if (state.timerId) {
          window.clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      async function handleLogin(form) {
        const codeInput = $('#access-code');
        const button = $('button[type="submit"]', form);
        const code = codeInput ? codeInput.value : '';
        state.loginMessage = '';
        setButtonBusy(button, true, 'Memeriksa kode...');
        try {
          const data = await api('login', code);
          state.token = data.token;
          storage.set(SESSION_KEY, data.token);
          state.role = data.role;
          await loadDashboard();
          showToast('Selamat datang, ' + data.name + '.', 'success');
        } catch (error) {
          state.loginMessage = error.message;
          setButtonBusy(button, false);
          renderLogin();
          const input = $('#access-code');
          if (input) input.focus();
        }
      }

      async function startPackage(packageId) {
        if (state.submitting) return;
        state.submitting = true;
        try {
          const data = await api('startAttempt', state.token, packageId);
          beginAttempt(data);
        } catch (error) {
          showToast(error.message, 'error');
          if (/sedang berjalan/i.test(error.message)) {
            await loadDashboard({ silent: true });
          }
        } finally {
          state.submitting = false;
        }
      }

      async function resumeAttempt() {
        if (!state.dashboard || !state.dashboard.activeAttempt) return;
        if (state.submitting) return;
        state.submitting = true;
        try {
          const data = await api('resumeAttempt', state.token, state.dashboard.activeAttempt.id);
          if (data.finished) {
            state.result = data.result;
            state.view = 'result';
            render();
            return;
          }
          beginAttempt(data);
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          state.submitting = false;
        }
      }

      function beginAttempt(data) {
        state.attempt = data.attempt;
        state.questions = data.questions || [];
        state.answers = {};
        (data.questions || []).forEach(function (q) {
          if (data.answers && Object.prototype.hasOwnProperty.call(data.answers, q.id)) {
            state.answers[q.id] = Number(data.answers[q.id]);
          }
        });
        state.index = 0;
        state.timerEnd = Date.now() + Math.max(0, Number(data.remainingSec) || 0) * 1000;
        state.view = 'quiz';
        state.submitting = false;
        state.saveQueue = Promise.resolve();
        state.pendingSaves = 0;
        if (state.timerId) {
          window.clearInterval(state.timerId);
          state.timerId = null;
        }
        render();
      }

      function selectAnswer(questionId, value) {
        const index = Number(value);
        if (!isFinite(index) || index < 0 || index > 3) return;
        state.answers[questionId] = index;
        $all('.answer-option').forEach(function (label) {
          const input = $('input', label);
          const isSelected = input && Number(input.value) === index;
          label.classList.toggle('is-selected', isSelected);
        });
        const answeredCount = Object.keys(state.answers).length;
        const progress = document.querySelector('.progress-track');
        if (progress) {
          progress.setAttribute('aria-valuenow', String(answeredCount));
          const bar = $('span', progress);
          if (bar) bar.style.width = Math.round((answeredCount / state.questions.length) * 100) + '%';
        }
        const status = $('#save-status');
        if (status) status.textContent = 'Menyimpan jawaban...';
        queueSave(questionId, index);
      }

      function queueSave(questionId, index) {
        state.pendingSaves += 1;
        state.saveQueue = state.saveQueue.then(function () {
          return api('saveAnswer', state.token, state.attempt.id, questionId, index)
            .then(function (response) {
              state.pendingSaves -= 1;
              if (response && response.expired) {
                updateSaveStatus();
                handleExpired();
                return;
              }
              updateSaveStatus();
            })
            .catch(function (error) {
              state.pendingSaves -= 1;
              const status = $('#save-status');
              if (status) {
                status.textContent = 'Jawaban belum tersimpan. Pilih ulang jawaban.';
                status.classList.remove('saved');
              }
              showToast('Jawaban belum tersimpan. Periksa koneksi lalu pilih ulang jawaban.', 'error');
              console.error(error);
            });
        });
      }

      function updateSaveStatus() {
        const status = $('#save-status');
        if (!status) return;
        if (state.pendingSaves > 0) {
          status.textContent = 'Menyimpan jawaban...';
          status.classList.remove('saved');
        } else {
          status.textContent = 'Tersimpan.';
          status.classList.add('saved');
        }
      }

      async function handleExpired() {
        if (state.submitting) return;
        state.submitting = true;
        showToast('Waktu habis. Jawaban dikumpulkan otomatis.', 'error');
        try {
          const result = await api('submitAttempt', state.token, state.attempt.id, 'timeout');
          result.timeout = true;
          state.result = result;
          state.view = 'result';
          state.attempt = null;
          if (state.timerId) {
            window.clearInterval(state.timerId);
            state.timerId = null;
          }
          render();
        } catch (error) {
          showToast(error.message, 'error');
          state.view = 'dashboard';
          await loadDashboard({ silent: true });
        } finally {
          state.submitting = false;
        }
      }

      async function submitQuiz(reason) {
        if (state.submitting) return;
        const unanswered = state.questions.length - Object.keys(state.answers).length;
        if (reason !== 'timeout') {
          const confirmed = await confirmDialog({
            title: 'Kumpulkan latihan ini?',
            message: unanswered > 0
              ? 'Masih ada ' + unanswered + ' soal yang belum dijawab. Jawaban kosong akan dihitung salah.'
              : 'Semua soal sudah dijawab. Setelah dikumpulkan, skor akan dihitung dan pembahasan menunggu persetujuan guru atau orang tua.',
            confirmLabel: 'Ya, kumpulkan',
            cancelLabel: 'Periksa lagi',
            danger: unanswered > 0
          });
          if (!confirmed) return;
        }
        state.submitting = true;
        const submitButton = $('[data-action="quiz-submit"]');
        if (submitButton) setButtonBusy(submitButton, true, 'Mengumpulkan...');
        try {
          await state.saveQueue;
          const result = await api('submitAttempt', state.token, state.attempt.id, reason === 'timeout' ? 'timeout' : 'manual');
          result.timeout = reason === 'timeout';
          state.result = result;
          state.view = 'result';
          state.attempt = null;
          state.questions = [];
          if (state.timerId) {
            window.clearInterval(state.timerId);
            state.timerId = null;
          }
          render();
        } catch (error) {
          showToast(error.message, 'error');
          setButtonBusy(submitButton, false);
        } finally {
          state.submitting = false;
        }
      }

      function autoSubmit() {
        if (state.view !== 'quiz' || state.submitting) return;
        submitQuiz('timeout');
      }

      function confirmDialog(options) {
        return new Promise(function (resolve) {
          const dialog = document.createElement('dialog');
          dialog.className = 'modal';
          dialog.innerHTML = '<div class="modal-inner">' +
            '<h2>' + esc(options.title) + '</h2>' +
            '<p>' + esc(options.message) + '</p>' +
            '<div class="modal-actions">' +
              '<button type="button" class="btn btn-secondary" data-dialog-cancel>' + esc(options.cancelLabel || 'Batal') + '</button>' +
              '<button type="button" class="btn ' + (options.danger ? 'btn-danger' : 'btn-primary') + '" data-dialog-confirm>' + esc(options.confirmLabel || 'Lanjutkan') + '</button>' +
            '</div>' +
          '</div>';
          document.body.appendChild(dialog);

          const close = function (value) {
            if (dialog.open) dialog.close();
            resolve(value);
            window.setTimeout(function () { dialog.remove(); }, 0);
          };

          $('[data-dialog-cancel]', dialog).addEventListener('click', function () { close(false); });
          $('[data-dialog-confirm]', dialog).addEventListener('click', function () { close(true); });
          dialog.addEventListener('cancel', function (event) {
            event.preventDefault();
            close(false);
          });
          dialog.addEventListener('click', function (event) {
            if (event.target === dialog) close(false);
          });
          dialog.showModal();
          const confirmButton = $('[data-dialog-confirm]', dialog);
          if (confirmButton) confirmButton.focus();
        });
      }

      async function openResult(attemptId) {
        try {
          const data = await api('getResult', state.token, attemptId);
          state.result = data;
          state.view = 'result';
          render();
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function openDetail(attemptId) {
        try {
          const data = await api('getResult', state.token, attemptId);
          state.detail = data;
          state.view = 'detail';
          render();
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function toggleReview(attemptId, unlocked, button) {
        setButtonBusy(button, true, unlocked ? 'Membuka...' : 'Menutup...');
        try {
          await api('setReviewUnlocked', state.token, attemptId, unlocked);
          showToast(unlocked ? 'Pembahasan dibuka untuk siswa.' : 'Pembahasan ditutup kembali.', 'success');
          if (state.view === 'detail') {
            state.detail = await api('getResult', state.token, attemptId);
            render();
          } else {
            await loadDashboard({ silent: true });
          }
        } catch (error) {
          showToast(error.message, 'error');
          setButtonBusy(button, false);
        }
      }

      async function requestReview(attemptId, button) {
        setButtonBusy(button, true, 'Mengirim...');
        try {
          await api('requestReview', state.token, attemptId);
          state.result.reviewRequested = true;
          render();
          showToast('Permintaan review sudah dikirim.', 'success');
        } catch (error) {
          showToast(error.message, 'error');
          setButtonBusy(button, false);
        }
      }

      async function handleStudentName(form) {
        const input = $('#student-name');
        const button = $('button[type="submit"]', form);
        setButtonBusy(button, true, 'Menyimpan...');
        try {
          const data = await api('updateStudentName', state.token, input.value);
          state.dashboard.studentName = data.studentName;
          showToast('Nama siswa disimpan.', 'success');
          render();
        } catch (error) {
          showToast(error.message, 'error');
          setButtonBusy(button, false);
        }
      }

      async function handleAccessCode(form) {
        const role = form.getAttribute('data-role');
        const input = $('input', form);
        const button = $('button[type="submit"]', form);
        setButtonBusy(button, true, 'Menyimpan...');
        try {
          const data = await api('updateAccessCode', state.token, role, input.value);
          state.dashboard.codes = data.codes;
          showToast('Kode akses diperbarui.', 'success');
          render();
        } catch (error) {
          showToast(error.message, 'error');
          setButtonBusy(button, false);
        }
      }

      async function logout() {
        const token = state.token;
        clearSession();
        state.view = 'login';
        state.loginMessage = '';
        render();
        if (token) {
          try { await api('logout', token); } catch (error) { /* sesi lokal tetap dihapus */ }
        }
      }

      function openQuestionMap() {
        const dialog = document.getElementById('question-dialog');
        if (dialog && !dialog.open) dialog.showModal();
      }

      function closeQuestionMap() {
        const dialog = document.getElementById('question-dialog');
        if (dialog && dialog.open) dialog.close();
      }

      function goToQuestion(index) {
        if (!state.questions.length) return;
        state.index = Math.min(Math.max(0, index), state.questions.length - 1);
        closeQuestionMap();
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function exitQuiz() {
        const confirmed = await confirmDialog({
          title: 'Keluar dari latihan?',
          message: 'Jawaban yang sudah dipilih tetap tersimpan, dan kamu bisa melanjutkan latihan ini nanti dari ruang belajar.',
          confirmLabel: 'Keluar ke ruang belajar',
          cancelLabel: 'Lanjut mengerjakan'
        });
        if (!confirmed) return;
        if (state.timerId) {
          window.clearInterval(state.timerId);
          state.timerId = null;
        }
        state.attempt = null;
        state.questions = [];
        state.answers = {};
        await loadDashboard({ silent: true });
      }

      async function handleClick(event) {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const action = target.getAttribute('data-action');

        if (action === 'toggle-theme') {
          applyTheme(state.theme === 'dark' ? 'light' : 'dark');
          const next = state.theme === 'dark' ? 'terang' : 'gelap';
          target.textContent = 'Mode ' + next;
          target.setAttribute('aria-pressed', state.theme === 'dark' ? 'true' : 'false');
          return;
        }

        if (action === 'toggle-code') {
          const input = $('#access-code');
          if (!input) return;
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          target.textContent = showing ? 'Tampilkan' : 'Sembunyikan';
          target.setAttribute('aria-label', showing ? 'Tampilkan kode akses' : 'Sembunyikan kode akses');
          input.focus();
          return;
        }

        if (action === 'logout') {
          await logout();
          return;
        }

        if (action === 'retry-boot') {
          boot();
          return;
        }

        if (action === 'back-dashboard') {
          if (state.view === 'quiz') {
            await exitQuiz();
            return;
          }
          state.view = 'dashboard';
          state.result = null;
          state.detail = null;
          await loadDashboard({ silent: true });
          return;
        }

        if (action === 'start-package') {
          const packageId = target.getAttribute('data-package');
          if (packageId) await startPackage(packageId);
          return;
        }

        if (action === 'resume-attempt') {
          await resumeAttempt();
          return;
        }

        if (action === 'open-result') {
          const id = target.getAttribute('data-attempt');
          if (id) await openResult(id);
          return;
        }

        if (action === 'open-detail') {
          const id = target.getAttribute('data-attempt');
          if (id) await openDetail(id);
          return;
        }

        if (action === 'open-settings') {
          state.view = 'settings';
          render();
          return;
        }

        if (action === 'toggle-review') {
          const id = target.getAttribute('data-attempt');
          const unlock = target.getAttribute('data-unlock') === 'true';
          if (id) await toggleReview(id, unlock, target);
          return;
        }

        if (action === 'request-review') {
          const id = target.getAttribute('data-attempt');
          if (id) await requestReview(id, target);
          return;
        }

        if (action === 'quiz-prev') {
          if (state.index > 0) goToQuestion(state.index - 1);
          return;
        }

        if (action === 'quiz-next') {
          if (state.index < state.questions.length - 1) goToQuestion(state.index + 1);
          return;
        }

        if (action === 'quiz-map') {
          openQuestionMap();
          return;
        }

        if (action === 'jump-question') {
          const index = Number(target.getAttribute('data-index'));
          if (isFinite(index)) goToQuestion(index);
          return;
        }

        if (action === 'close-map') {
          closeQuestionMap();
          return;
        }

        if (action === 'quiz-submit') {
          closeQuestionMap();
          await submitQuiz('manual');
          return;
        }

        if (action === 'quiz-exit') {
          await exitQuiz();
          return;
        }
      }

      document.addEventListener('click', function (event) {
        handleClick(event).catch(function (error) {
          console.error(error);
          showToast('Terjadi kendala. Coba lagi.', 'error');
        });
      });

      document.addEventListener('change', function (event) {
        const input = event.target.closest('input[data-answer]');
        if (input) {
          selectAnswer(input.getAttribute('data-answer'), input.value);
        }
      });

      document.addEventListener('submit', function (event) {
        const form = event.target.closest('form[data-form]');
        if (!form) return;
        event.preventDefault();
        const type = form.getAttribute('data-form');
        if (type === 'login') {
          handleLogin(form);
        } else if (type === 'student-name') {
          handleStudentName(form);
        } else if (type === 'access-code') {
          handleAccessCode(form);
        }
      });

      document.addEventListener('click', function (event) {
        const dialog = event.target.closest('dialog');
        if (dialog && event.target === dialog) {
          dialog.close();
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && state.view === 'quiz') {
          updateTimerDisplay();
          if (remainingSeconds() <= 0) autoSubmit();
        }
      });

      window.addEventListener('beforeunload', function (event) {
        if (state.view === 'quiz' && state.timerEnd) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      boot();
    })();
  </script>
</body>
</html>
