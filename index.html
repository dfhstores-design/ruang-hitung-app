<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6EFE1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ruang Hitung">
  <title>Ruang Hitung - Latihan Matematika Kelas 9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #F6EFE1;
      --surface: #FFF9EE;
      --surface-2: #F1E7D6;
      --ink: #20304A;
      --ink-muted: #5C6675;
      --line: #D8CDBA;
      --line-strong: #8E7F6A;
      --accent: #B84A24;
      --accent-hover: #9E3E1D;
      --accent-ink: #FFF9EE;
      --accent-soft: #F2D8CB;
      --success: #2E6A4F;
      --success-bg: #E4EFE7;
      --danger: #A33A32;
      --danger-bg: #F7E3DF;
      --focus: #1D5FA8;
      --hero-bg: #20304A;
      --hero-ink: #FFF9EE;
      --hero-muted: #C9D2DF;
      --shadow: 0 22px 60px rgba(32, 48, 74, 0.16);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "Atkinson Hyperlegible", "Segoe UI", Tahoma, sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --paper: #18202C;
      --surface: #212B3A;
      --surface-2: #2A3546;
      --ink: #F4ECDD;
      --ink-muted: #C3BCB1;
      --line: #3D4859;
      --line-strong: #718096;
      --accent: #F09A72;
      --accent-hover: #FFB08C;
      --accent-ink: #2A160E;
      --accent-soft: #4A2B20;
      --success: #8ED6B0;
      --success-bg: #203B30;
      --danger: #F2A39A;
      --danger-bg: #462522;
      --focus: #9CCFFF;
      --hero-bg: #2A3546;
      --hero-ink: #F4ECDD;
      --hero-muted: #C3BCB1;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    img,
    svg {
      max-width: 100%;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.12;
    }

    p {
      margin-bottom: 1rem;
    }

    code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 0.92em;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      overflow-wrap: anywhere;
    }

    .skip-link {
      position: fixed;
      left: 16px;
      top: -80px;
      z-index: 100;
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--focus);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-weight: 700;
      transition: top 120ms ease;
    }

    .skip-link:focus {
      top: 16px;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    #main:focus,
    #main:focus-visible {
      outline: none;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--ink);
    }

    .app-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px clamp(16px, 4vw, 40px) 64px;
    }

    .app-shell.narrow {
      width: min(900px, 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 56px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: clamp(24px, 4vw, 40px);
    }

    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      border: 0;
      background: transparent;
      padding: 8px 0;
      cursor: pointer;
      text-align: left;
      min-height: 44px;
    }

    .wordmark-name {
      font-family: var(--font-display);
      font-size: 1.22rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .wordmark-note {
      color: var(--ink-muted);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink-muted);
      font-size: 0.88rem;
      padding: 0 8px;
    }

    .role-chip strong {
      color: var(--ink);
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 17px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--line-strong);
      color: var(--ink);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #FFF9EE;
    }

    .btn-danger:hover:not(:disabled) {
      filter: brightness(0.92);
    }

    .btn-small {
      min-height: 40px;
      padding: 8px 13px;
      font-size: 0.92rem;
    }

    .btn-block {
      width: 100%;
    }

    .text-button {
      border: 0;
      background: transparent;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 6px 0;
      min-height: 44px;
      cursor: pointer;
      font-weight: 700;
    }

    .text-button:hover {
      color: var(--accent-hover);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field label,
    .field-label {
      font-weight: 700;
      font-size: 0.93rem;
    }

    .field-hint {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.86rem;
    }

    .input {
      width: 100%;
      min-height: 50px;
      padding: 11px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      font-size: 1rem;
    }

    .input::placeholder {
      color: var(--ink-muted);
      opacity: 1;
    }

    .input:focus {
      border-color: var(--focus);
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input {
      padding-right: 88px;
    }

    .input-action {
      position: absolute;
      right: 4px;
      top: 4px;
      min-height: 42px;
      padding: 6px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .input-action:hover {
      background: var(--surface-2);
    }

    .alert {
      display: grid;
      gap: 2px;
      border: 1px solid var(--danger);
      border-left-width: 4px;
      background: var(--danger-bg);
      color: var(--ink);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      margin-bottom: 16px;
      font-size: 0.93rem;
    }

    .alert strong {
      color: var(--danger);
    }

    .alert-info {
      border-color: var(--line-strong);
      border-left-color: var(--accent);
      background: var(--surface-2);
    }

    .boot-screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .boot-mark {
      width: 56px;
      height: 56px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--accent);
      background: var(--surface);
    }

    .boot-text {
      color: var(--ink-muted);
    }

    .login-page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 32px);
      min-height: 100dvh;
      display: grid;
      align-content: center;
    }

    .login-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      gap: clamp(24px, 4vw, 52px);
      align-items: center;
    }

    .login-cover {
      position: relative;
      padding: clamp(24px, 4vw, 48px);
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .login-cover::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: clamp(18px, 3vw, 32px);
      border-left: 1px dashed var(--line-strong);
      opacity: 0.8;
      pointer-events: none;
    }

    .cover-inner {
      position: relative;
      padding-left: clamp(18px, 3vw, 32px);
    }

    .cover-kicker {
      display: flex;
      gap: 14px;
      align-items: baseline;
      margin-bottom: clamp(32px, 6vw, 64px);
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .cover-number {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 1.05rem;
    }

    .login-cover h1 {
      font-size: clamp(2.2rem, 5.5vw, 4.5rem);
      max-width: 10ch;
      margin-bottom: 18px;
    }

    .login-cover .lead {
      max-width: 46ch;
      color: var(--ink-muted);
      font-size: clamp(1rem, 1.4vw, 1.1rem);
      margin-bottom: 32px;
    }

    .formula-list {
      display: grid;
      gap: 0;
      max-width: 33rem;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line-strong);
    }

    .formula-list li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px dashed var(--line-strong);
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 1.3vw, 1.08rem);
    }

    .formula-list span {
      color: var(--ink-muted);
      font-family: var(--font-body);
      font-size: 0.78rem;
      text-align: right;
      align-self: center;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: clamp(22px, 4vw, 34px);
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      font-size: clamp(1.5rem, 2.5vw, 1.9rem);
      margin-bottom: 6px;
    }

    .login-card .intro {
      color: var(--ink-muted);
      margin-bottom: 22px;
    }

    .login-footnote {
      margin: 16px 0 0;
      color: var(--ink-muted);
      font-size: 0.82rem;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: clamp(24px, 4vw, 38px);
    }

    .page-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .page-kicker .number {
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 1rem;
    }

    .page-head h1 {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      margin-bottom: 0;
      max-width: 18ch;
    }

    .date-note {
      color: var(--ink-muted);
      font-size: 0.92rem;
      text-align: right;
      padding-bottom: 6px;
    }

    .dashboard-main {
      position: relative;
      padding-left: clamp(14px, 2vw, 24px);
    }

    .dashboard-main::before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 8px;
      left: 0;
      border-left: 1px dashed var(--line-strong);
      opacity: 0.7;
      pointer-events: none;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: clamp(18px, 3vw, 28px);
      align-items: start;
    }

    .stack {
      display: grid;
      gap: clamp(18px, 3vw, 26px);
    }

    .simulation-card {
      position: relative;
      background: var(--hero-bg);
      color: var(--hero-ink);
      border: 1px solid var(--hero-bg);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 4vw, 38px);
      overflow: hidden;
    }

    .simulation-card::after {
      content: "x";
      position: absolute;
      right: clamp(18px, 4vw, 38px);
      bottom: -0.18em;
      font-family: var(--font-display);
      font-size: clamp(7rem, 18vw, 13rem);
      line-height: 0.8;
      color: var(--hero-ink);
      opacity: 0.07;
      pointer-events: none;
    }

    .simulation-card .card-kicker {
      color: var(--hero-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .simulation-card h2 {
      font-size: clamp(2rem, 4.2vw, 3.4rem);
      max-width: 12ch;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .simulation-card .card-copy {
      color: var(--hero-muted);
      max-width: 43ch;
      margin-bottom: 26px;
      position: relative;
      z-index: 1;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 26px;
      color: inherit;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }

    .meta-line span {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }

    .meta-line strong {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 600;
    }

    .simulation-card .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      position: relative;
      z-index: 1;
    }

    .simulation-card .btn-secondary {
      background: transparent;
      border-color: var(--hero-muted);
      color: var(--hero-ink);
      position: relative;
      z-index: 1;
    }

    .active-strip {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .active-strip strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.1rem;
    }

    .active-strip p {
      margin: 2px 0 0;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: clamp(18px, 3vw, 26px);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .panel-head h2 {
      font-size: clamp(1.3rem, 2.4vw, 1.7rem);
      margin: 0;
    }

    .panel-note {
      color: var(--ink-muted);
      font-size: 0.88rem;
      margin: 0;
    }

    .quick-practice {
      display: grid;
      gap: 16px;
    }

    .quick-practice .quick-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .quick-practice h2 {
      font-size: clamp(1.35rem, 2.4vw, 1.7rem);
      margin: 0;
    }

    .quick-practice .meta-line {
      margin-bottom: 0;
      color: var(--ink-muted);
    }

    .section-block {
      margin-top: clamp(30px, 5vw, 48px);
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .section-title-row h2 {
      font-size: clamp(1.45rem, 2.6vw, 1.9rem);
      margin: 0;
    }

    .section-title-row p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .topic-list {
      border-top: 1px solid var(--line-strong);
    }

    .topic-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .topic-row h3 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.35;
      margin: 0 0 2px;
    }

    .topic-row p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.85rem;
    }

    .topic-row .btn {
      min-width: 100px;
    }

    .history-list {
      border-top: 1px solid var(--line-strong);
    }

    .history-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 16px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .history-main {
      min-width: 0;
    }

    .history-main h3 {
      font-family: var(--font-body);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.35;
      margin: 0 0 3px;
      overflow-wrap: anywhere;
    }

    .history-main p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.84rem;
    }

    .score-mark {
      font-family: var(--font-display);
      font-size: 1.55rem;
      line-height: 1;
      min-width: 54px;
      text-align: right;
    }

    .score-mark small {
      font-family: var(--font-body);
      font-size: 0.7rem;
      color: var(--ink-muted);
      font-weight: 400;
    }

    .status-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .status-text::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line-strong);
      flex: 0 0 auto;
    }

    .status-text.is-open {
      color: var(--success);
    }

    .status-text.is-open::before {
      background: var(--success);
    }

    .status-text.is-waiting {
      color: var(--accent);
    }

    .status-text.is-waiting::before {
      background: var(--accent);
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
    }

    .empty-state strong {
      display: block;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.14rem;
      margin-bottom: 4px;
    }

    .empty-state p {
      margin: 0 auto;
      max-width: 46ch;
      font-size: 0.9rem;
    }

    .monitor-summary {
      display: flex;
      align-items: baseline;
      gap: 8px 18px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.96rem;
      margin-bottom: 20px;
    }

    .monitor-summary strong {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
    }

    .attempt-list {
      border-top: 1px solid var(--line-strong);
    }

    .attempt-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .attempt-row h3 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.35;
      margin: 0 0 3px;
    }

    .attempt-row p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.84rem;
    }

    .attempt-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .attempt-scoreline {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      color: var(--ink-muted);
      font-size: 0.84rem;
    }

    .attempt-scoreline strong {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(18px, 3vw, 28px);
      align-items: start;
    }

    .code-list {
      display: grid;
      gap: 16px;
    }

    .code-item {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .code-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .code-item .field {
      margin-bottom: 6px;
    }

    .code-item .field-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .code-item .field-label span {
      color: var(--ink-muted);
      font-weight: 400;
      font-size: 0.82rem;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    .detail-hero h1 {
      font-size: clamp(1.9rem, 4vw, 3rem);
      margin-bottom: 6px;
    }

    .detail-hero p {
      margin: 0;
      color: var(--ink-muted);
    }

    .detail-score {
      text-align: right;
    }

    .detail-score .number {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 5rem);
      line-height: 0.9;
    }

    .detail-score .caption {
      color: var(--ink-muted);
      font-size: 0.82rem;
    }

    .action-panel {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      padding: 16px 18px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin-bottom: 24px;
    }

    .action-panel h2 {
      font-size: 1.08rem;
      font-family: var(--font-body);
      letter-spacing: 0;
      margin: 0 0 2px;
    }

    .action-panel p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.88rem;
    }

    .topic-stats {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
    }

    .topic-stat {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 14px;
      align-items: baseline;
    }

    .topic-stat .name {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .topic-stat .value {
      color: var(--ink-muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .bar {
      grid-column: 1 / -1;
      height: 7px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .review-list {
      display: grid;
      gap: 10px;
    }

    .review-item {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }

    .review-item summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      min-height: 56px;
      cursor: pointer;
      list-style: none;
    }

    .review-item summary::-webkit-details-marker {
      display: none;
    }

    .review-item summary:hover {
      background: var(--surface-2);
    }

    .review-number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--ink-muted);
      flex: 0 0 auto;
    }

    .review-summary-text {
      min-width: 0;
    }

    .review-summary-text strong {
      display: block;
      font-size: 0.94rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .review-summary-text span {
      display: block;
      color: var(--ink-muted);
      font-size: 0.79rem;
      margin-top: 1px;
    }

    .review-verdict {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .review-verdict.correct {
      color: var(--success);
    }

    .review-verdict.wrong {
      color: var(--danger);
    }

    .review-body {
      padding: 0 16px 18px;
      border-top: 1px solid var(--line);
    }

    .review-question {
      font-family: var(--font-display);
      font-size: 1.12rem;
      line-height: 1.5;
      margin: 16px 0;
      overflow-wrap: anywhere;
    }

    .review-options {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .review-option {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
    }

    .review-option .letter {
      font-weight: 700;
      color: var(--ink-muted);
    }

    .review-option.is-correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .review-option.is-correct .letter {
      color: var(--success);
    }

    .review-option.is-selected-wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .review-option.is-selected-wrong .letter {
      color: var(--danger);
    }

    .option-tag {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--ink-muted);
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 0 4px;
      vertical-align: 1px;
    }

    .solution {
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .solution strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .result-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 26px;
    }

    .result-hero h1 {
      font-size: clamp(1.9rem, 4vw, 3rem);
      margin-bottom: 8px;
    }

    .result-hero p {
      color: var(--ink-muted);
      max-width: 50ch;
      margin-bottom: 0;
    }

    .score-display {
      text-align: right;
    }

    .score-display .number {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 7rem);
      line-height: 0.82;
      letter-spacing: -0.04em;
    }

    .score-display .out-of {
      color: var(--ink-muted);
      font-size: 0.86rem;
    }

    .score-bar {
      height: 10px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
      margin: 20px 0 6px;
    }

    .score-bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .score-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.84rem;
    }

    .locked-panel {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      padding: 20px;
      margin-bottom: 24px;
    }

    .locked-panel h2 {
      font-family: var(--font-body);
      font-size: 1.08rem;
      letter-spacing: 0;
      margin-bottom: 6px;
    }

    .locked-panel p {
      color: var(--ink-muted);
      font-size: 0.92rem;
      max-width: 60ch;
    }

    .locked-panel .btn {
      margin-top: 4px;
    }

    .quiz-shell {
      width: min(900px, 100%);
      margin: 0 auto;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }

    .quiz-top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--line-strong);
      padding: 10px 0 12px;
      margin-bottom: 20px;
    }

    .quiz-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .quiz-label {
      color: var(--ink-muted);
      font-size: 0.82rem;
    }

    .quiz-label strong {
      color: var(--ink);
      font-size: 0.95rem;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      background: var(--surface);
      white-space: nowrap;
    }

    .timer.is-urgent {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
    }

    .timer .timer-note {
      font-weight: 400;
      color: var(--ink-muted);
      font-size: 0.76rem;
      margin-right: 5px;
    }

    .progress-track {
      height: 5px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }

    .progress-track span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 38px);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.84rem;
      margin-bottom: 18px;
    }

    .question-meta .question-number {
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 1.05rem;
    }

    .question-text {
      font-family: var(--font-display);
      font-size: clamp(1.28rem, 2.6vw, 1.7rem);
      line-height: 1.48;
      margin-bottom: 24px;
      overflow-wrap: anywhere;
    }

    .answer-list {
      display: grid;
      gap: 10px;
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    .answer-option {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-height: 56px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .answer-option:hover {
      background: var(--surface-2);
    }

    .answer-option.is-selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .answer-option input:focus-visible + .option-letter {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .option-letter {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--ink-muted);
      flex: 0 0 auto;
    }

    .answer-option.is-selected .option-letter {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .option-text {
      padding-top: 3px;
      overflow-wrap: anywhere;
    }

    .quiz-save-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 24px;
      color: var(--ink-muted);
      font-size: 0.82rem;
    }

    .quiz-save-status .saved {
      color: var(--success);
    }

    .quiz-footer {
      position: sticky;
      bottom: 0;
      z-index: 19;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--paper);
      border-top: 1px solid var(--line-strong);
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      margin-top: 18px;
    }

    .quiz-footer-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quiz-footer .btn {
      min-width: 44px;
    }

    .modal {
      width: min(560px, calc(100vw - 32px));
      max-height: min(86dvh, 720px);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--ink);
      padding: 0;
      box-shadow: var(--shadow);
    }

    .modal::backdrop {
      background: rgba(15, 23, 36, 0.58);
    }

    .modal-inner {
      padding: clamp(20px, 4vw, 28px);
    }

    .modal h2 {
      font-size: clamp(1.35rem, 3vw, 1.7rem);
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--ink-muted);
      font-size: 0.94rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .question-map {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      margin: 18px 0 4px;
    }

    .map-button {
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      position: relative;
    }

    .map-button:hover {
      background: var(--surface-2);
    }

    .map-button.is-answered {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .map-button.is-current {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .map-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.8rem;
      margin-top: 12px;
    }

    .map-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .map-legend i {
      width: 9px;
      height: 9px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      display: inline-block;
    }

    .map-legend .answered {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .toast-region {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      display: grid;
      gap: 8px;
      width: min(380px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      background: var(--hero-bg);
      color: var(--hero-ink);
      border: 1px solid var(--hero-bg);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      line-height: 1.45;
      pointer-events: auto;
    }

    .toast.is-error {
      background: var(--danger-bg);
      color: var(--ink);
      border-color: var(--danger);
    }

    .toast.is-success {
      background: var(--success-bg);
      color: var(--ink);
      border-color: var(--success);
    }

    .footer-note {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--ink-muted);
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .loading-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 900ms ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }

    @media (max-width: 920px) {
      .login-layout {
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .login-cover {
        padding: 24px;
      }

      .login-cover::before {
        left: 18px;
      }

      .cover-inner {
        padding-left: 18px;
      }

      .cover-kicker {
        margin-bottom: 24px;
      }

      .login-cover h1 {
        max-width: 13ch;
      }

      .formula-list {
        display: none;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .app-shell {
        padding-top: 12px;
        padding-bottom: 40px;
      }

      .topbar {
        align-items: flex-start;
        gap: 10px;
      }

      .wordmark-note {
        display: none;
      }

      .topbar-actions {
        width: 100%;
        justify-content: space-between;
      }

      .role-chip {
        padding-left: 0;
      }

      .page-head {
        align-items: flex-start;
      }

      .date-note {
        text-align: left;
        padding-bottom: 0;
      }

      .dashboard-main {
        padding-left: 14px;
      }

      .simulation-card h2 {
        max-width: 14ch;
      }

      .history-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .history-row .status-text {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .history-row .btn {
        grid-column: 2;
        grid-row: 1;
      }

      .attempt-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .attempt-actions {
        justify-content: flex-start;
      }

      .detail-hero,
      .result-hero {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .detail-score,
      .score-display {
        text-align: left;
      }

      .detail-score .number,
      .score-display .number {
        font-size: clamp(3.4rem, 16vw, 5rem);
      }

      .quiz-top {
        padding-top: 6px;
      }

      .quiz-footer {
        gap: 8px;
      }

      .quiz-footer .quiz-footer-group:last-child {
        margin-left: auto;
      }

      .question-text {
        font-size: clamp(1.2rem, 5.5vw, 1.45rem);
      }

      .review-item summary {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .review-verdict {
        grid-column: 2;
        grid-row: 2;
      }

      .login-page {
        padding: 14px;
      }

      .login-card {
        padding: 20px;
      }

      .footer-note {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  
    /* Ruang Hitung v2 additions */
    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      padding: 4px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .role-tab {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink-muted);
      font-weight: 700;
      cursor: pointer;
    }

    .role-tab:hover {
      color: var(--ink);
      background: var(--surface);
    }

    .role-tab[aria-selected="true"] {
      background: var(--surface);
      border-color: var(--line-strong);
      color: var(--ink);
    }

    .login-hint {
      margin: 0 0 18px;
      color: var(--ink-muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .mode-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      color: var(--ink);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      vertical-align: 2px;
    }

    .mode-tag.practice {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .mode-tag.exam {
      border-color: var(--ink);
      color: var(--ink);
    }

    .practice-feature {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 3vw, 28px);
    }

    .practice-feature h2 {
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      margin-bottom: 8px;
    }

    .practice-feature .lead {
      color: var(--ink-muted);
      max-width: 55ch;
      margin-bottom: 18px;
    }

    .practice-feature .meta-line {
      color: var(--ink-muted);
      margin-bottom: 18px;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
      gap: clamp(16px, 2.5vw, 22px);
    }

    .exam-card {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 3vw, 28px);
    }

    .exam-card.is-primary {
      background: var(--hero-bg);
      border-color: var(--hero-bg);
      color: var(--hero-ink);
    }

    .exam-card h2 {
      font-size: clamp(1.5rem, 2.8vw, 2.15rem);
      margin-bottom: 8px;
    }

    .exam-card p {
      color: var(--ink-muted);
      font-size: 0.92rem;
      margin-bottom: 16px;
    }

    .exam-card.is-primary p,
    .exam-card.is-primary .meta-line {
      color: var(--hero-muted);
    }

    .exam-card .meta-line {
      margin-bottom: 18px;
    }

    .exam-card.is-primary .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .reminder-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 16px 18px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin-top: 18px;
    }

    .reminder-panel h2 {
      font-family: var(--font-body);
      font-size: 1rem;
      letter-spacing: 0;
      margin: 0 0 2px;
    }

    .reminder-panel p {
      color: var(--ink-muted);
      font-size: 0.86rem;
      margin: 0;
      max-width: 58ch;
    }

    .reminder-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .teacher-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .summary-line {
      display: flex;
      align-items: baseline;
      gap: 8px 20px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.94rem;
      margin-bottom: 20px;
    }

    .summary-line strong {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
    }

    .teacher-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .search-input {
      max-width: 300px;
    }

    .student-table {
      border-top: 1px solid var(--line-strong);
    }

    .student-table-head {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) 90px 110px 150px auto;
      gap: 14px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line-strong);
      color: var(--ink-muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .student-row {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) 90px 110px 150px auto;
      gap: 14px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .student-row .student-name {
      min-width: 0;
    }

    .student-row .student-name strong {
      display: block;
      font-size: 0.97rem;
      overflow-wrap: anywhere;
    }

    .student-row .student-name span {
      display: block;
      color: var(--ink-muted);
      font-size: 0.78rem;
      margin-top: 1px;
    }

    .student-metric {
      color: var(--ink-muted);
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .student-metric strong {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 7px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .student-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .teacher-empty {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      padding: 22px;
      color: var(--ink-muted);
      text-align: center;
      font-size: 0.9rem;
    }

    .upload-panel {
      display: grid;
      gap: 18px;
    }

    .upload-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-drop {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      padding: 18px;
    }

    .file-drop .field {
      margin-bottom: 0;
    }

    .file-drop input[type="file"] {
      width: 100%;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .file-drop input[type="file"]::file-selector-button {
      min-height: 40px;
      margin-right: 10px;
      padding: 8px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 0.9rem;
      color: var(--ink-muted);
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex: 0 0 auto;
      accent-color: var(--accent);
    }

    .notice {
      border: 1px solid var(--line-strong);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 11px 13px;
      color: var(--ink-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .preview-box {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      font-size: 0.88rem;
    }

    .preview-box h3 {
      font-family: var(--font-body);
      font-size: 0.92rem;
      letter-spacing: 0;
      margin: 0 0 6px;
    }

    .preview-list {
      margin: 0;
      padding-left: 18px;
      color: var(--ink-muted);
    }

    .preview-list li {
      margin-bottom: 4px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0 16px;
    }

    .form-grid .field.full {
      grid-column: 1 / -1;
    }

    .student-modal .modal-inner {
      max-height: min(80dvh, 680px);
      overflow-y: auto;
    }

    .teacher-note {
      color: var(--ink-muted);
      font-size: 0.86rem;
      margin: 0;
    }

    .quiz-no-timer {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      background: var(--surface);
      color: var(--ink-muted);
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .result-mode-note {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 14px 16px;
      margin-bottom: 24px;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .result-mode-note strong {
      color: var(--ink);
    }

    .teacher-student-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .teacher-student-head h1 {
      font-size: clamp(1.9rem, 4vw, 3rem);
      margin-bottom: 4px;
    }

    .teacher-student-head p {
      margin: 0;
      color: var(--ink-muted);
    }

    .teacher-student-head .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .data-footnote {
      color: var(--ink-muted);
      font-size: 0.8rem;
      margin-top: 10px;
    }

    @media (max-width: 920px) {
      .exam-grid {
        grid-template-columns: 1fr;
      }

      .student-table-head {
        display: none;
      }

      .student-row {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 14px;
        padding: 15px 0;
      }

      .student-row .student-name {
        grid-column: 1 / -1;
      }

      .student-row .student-metric {
        grid-column: auto;
      }

      .student-row .student-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .student-row .student-metric:nth-of-type(4) {
        display: none;
      }
    }

    @media (max-width: 680px) {
      .role-tabs {
        gap: 3px;
      }

      .role-tab {
        font-size: 0.88rem;
        padding: 4px;
      }

      .exam-card,
      .practice-feature {
        padding: 18px;
      }

      .reminder-panel {
        align-items: flex-start;
      }

      .reminder-actions,
      .teacher-actions,
      .upload-actions {
        width: 100%;
      }

      .reminder-actions .btn,
      .teacher-actions .btn,
      .upload-actions .btn {
        flex: 1 1 auto;
      }

      .search-input {
        max-width: none;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .field.full {
        grid-column: auto;
      }

      .student-row .student-metric:nth-of-type(4) {
        display: block;
      }

      .teacher-student-head {
        align-items: flex-start;
      }
    }

  
    /* v3 flags, difficult questions, audit */
    .flag-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .flag-note {
      color: var(--ink-muted);
      font-size: 0.8rem;
      overflow-wrap: anywhere;
    }

    .difficult-list {
      border-top: 1px solid var(--line-strong);
    }

    .difficult-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .difficult-item h3 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.45;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
    }

    .difficult-meta {
      display: flex;
      gap: 6px 14px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.82rem;
    }

    .difficult-notes {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--ink-muted);
      font-size: 0.86rem;
    }

    .audit-list {
      border-top: 1px solid var(--line-strong);
    }

    .audit-row {
      display: grid;
      grid-template-columns: 150px 140px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.86rem;
    }

    .audit-row > span:first-child {
      color: var(--ink-muted);
      font-size: 0.78rem;
    }

    .audit-row > span:last-child {
      color: var(--ink-muted);
      overflow-wrap: anywhere;
    }

    @media (max-width: 680px) {
      .audit-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

  
    /* v3 teacher editors */
    textarea.input {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    .question-list,
    .package-list {
      border-top: 1px solid var(--line-strong);
    }

    .question-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .question-row strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .question-row span {
      display: block;
      color: var(--ink-muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .package-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .package-row strong {
      display: block;
      font-size: 0.96rem;
      font-weight: 700;
    }

    .package-row span {
      display: block;
      color: var(--ink-muted);
      font-size: 0.8rem;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .topic-checks {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px 14px;
      padding-top: 4px;
    }

    .topic-checks .checkbox-row {
      font-size: 0.84rem;
    }

    @media (max-width: 680px) {
      .question-row,
      .package-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .topic-checks {
        grid-template-columns: 1fr;
      }
    }

  
    /* v3 live quiz */
    .live-join-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .live-panel {
      margin-top: 8px;
    }

    .live-code {
      font-family: var(--font-display);
      font-size: clamp(3rem, 12vw, 6rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--accent);
      margin: 8px 0 14px;
      overflow-wrap: anywhere;
    }

    .live-participants {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 12px 0 18px;
    }

    .live-participants span {
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .live-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--ink-muted);
      font-size: 0.86rem;
      margin-bottom: 10px;
    }

    .live-timer {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      background: var(--surface-2);
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .live-timer strong {
      font-size: 1.05rem;
    }

    .live-options {
      display: grid;
      gap: 8px;
      margin: 18px 0;
    }

    .live-option {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      font: inherit;
    }

    .live-option > span {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--ink-muted);
    }

    .live-option strong {
      font-weight: 400;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .live-option em {
      font-style: normal;
      color: var(--ink-muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .live-answer {
      cursor: pointer;
    }

    .live-answer:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .live-answer:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .live-option.is-selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .live-option.is-correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .live-option.is-selected-wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .live-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .live-leaderboard {
      border-top: 1px solid var(--line-strong);
    }

    .live-rank {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 100px 90px;
      gap: 10px;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
    }

    .live-rank span:first-child {
      color: var(--accent);
      font-family: var(--font-display);
    }

    .live-rank span:nth-child(3),
    .live-rank span:nth-child(4) {
      color: var(--ink-muted);
      text-align: right;
      font-size: 0.8rem;
    }

    @media (max-width: 680px) {
      .live-rank {
        grid-template-columns: 26px minmax(0, 1fr) 80px;
      }

      .live-rank span:nth-child(4) {
        display: none;
      }

      .live-option {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .live-option em {
        grid-column: 2;
      }
    }

  
    .install-steps {
      display: grid;
      gap: 8px;
      color: var(--ink-muted);
      font-size: 0.9rem;
      margin: 14px 0;
    }

    .install-steps strong {
      color: var(--ink);
      margin-top: 8px;
    }

    .install-steps ol {
      margin: 4px 0 0;
      padding-left: 20px;
    }

    .install-steps li {
      margin-bottom: 3px;
    }

  
    /* Mobile-first v3.1: base mobile layout, desktop enhancements above 680px */
    .btn-small {
      min-height: 44px;
    }

    .share-link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }

    .share-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .share-link-row .input {
      font-size: 0.86rem;
      min-width: 0;
    }

    @media (max-width: 680px) {
      body {
        padding-bottom: env(safe-area-inset-bottom);
      }

      .app-shell {
        padding: 12px 14px 52px;
      }

      .topbar {
        gap: 8px;
        margin-bottom: 18px;
        padding-bottom: 10px;
      }

      .wordmark {
        min-height: 44px;
      }

      .wordmark-name {
        font-size: 1.14rem;
      }

      .topbar-actions {
        gap: 4px;
      }

      .topbar-actions .btn {
        min-height: 44px;
        padding: 8px 10px;
      }

      .role-chip {
        font-size: 0.8rem;
        padding: 0 4px;
      }

      .page-head {
        gap: 8px;
        margin-bottom: 18px;
      }

      .page-head h1 {
        font-size: clamp(1.75rem, 8vw, 2.05rem);
        max-width: 100%;
      }

      .date-note {
        font-size: 0.8rem;
        padding-bottom: 0;
      }

      .dashboard-main {
        padding-left: 12px;
      }

      .dashboard-main::before {
        left: 2px;
      }

      .section-title-row {
        gap: 4px;
        margin-bottom: 12px;
      }

      .section-title-row h2 {
        font-size: 1.35rem;
      }

      .section-title-row p {
        font-size: 0.82rem;
      }

      .panel {
        padding: 16px 14px;
      }

      .panel-head h2 {
        font-size: 1.25rem;
      }

      .practice-feature,
      .exam-card {
        padding: 18px 16px;
      }

      .practice-feature h2 {
        font-size: 1.65rem;
      }

      .teacher-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
      }

      .teacher-actions .btn {
        width: 100%;
        min-height: 44px;
        padding: 10px 8px;
        font-size: 0.88rem;
      }

      .teacher-actions .btn:only-child,
      .teacher-actions .btn:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }

      .summary-line {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        align-items: stretch;
      }

      .summary-line > span {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .summary-line strong {
        font-size: 1.3rem;
        line-height: 1.1;
      }

      .student-row {

<body data-app-mode="standalone">

      </div>

  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
(function () {
  'use strict';

  const APP_NAME = 'Ruang Hitung';
  const APP_URL = 'https://script.google.com/macros/s/AKfycbw6FaGYiLy_kG8Q56EEHGwIEGufCOfrfArKPKtpSCxI5x4Qz-P5EJYGSvUw3QkSOp3J/exec';
  const SESSION_KEY = 'ruang_hitung_token';
  const THEME_KEY = 'ruang_hitung_theme';

  const storage = {
    get: function (key) {
      try { return window.sessionStorage.getItem(key); } catch (error) { return null; }
    },
    set: function (key, value) {
      try { window.sessionStorage.setItem(key, value); } catch (error) { /* memory only */ }
    },
    remove: function (key) {
      try { window.sessionStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
  };

  const local = {
    get: function (key) {
      try { return window.localStorage.getItem(key); } catch (error) { return null; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem(key, value); } catch (error) { /* ignore */ }
    },
    remove: function (key) {
      try { window.localStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
  };

  const state = {
    token: storage.get(SESSION_KEY),
    view: 'boot',
    role: null,
    dashboard: null,
    attempt: null,
    attemptMode: '',
    questions: [],
    answers: {},
    index: 0,
    timerEnd: 0,
    timerId: null,
    reminderTimerId: null,
    submitting: false,
    saveQueue: Promise.resolve(),
    pendingSaves: 0,
    result: null,
    detail: null,
    difficult: null,
    auditLogs: null,
    teacherQuestions: null,
    teacherPackages: null,
    reportLinks: null,
    reportLoading: false,
    live: null,
    livePollId: null,
    liveClockId: null,
    liveHash: '',
    loginRole: 'student',
    loginMessage: '',
    bootError: '',
    theme: local.get(THEME_KEY) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
    reminderPromptShown: false,
    upload: {
      fileName: '',
      rows: [],
      errors: []
    }
  };

  const app = document.getElementById('app');
  const toastRegion = document.getElementById('toast-region');

  function $(selector, root) {
    return (root || document).querySelector(selector);
  }

  function $all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char];
    });
  }

  function textBlock(value) {
    return esc(value).replace(/\n/g, '<br>');
  }

  function applyTheme(theme) {
    state.theme = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    local.set(THEME_KEY, state.theme);
  }

  function api(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return fetch(APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: fn, args: args })
    }).then(function (response) {
      return response.text().then(function (text) {
        let data;
        try {
          data = JSON.parse(text);
        } catch (error) {
          throw new Error('Respons server tidak valid. Coba lagi.');
        }
        if (data && data.error) throw new Error(data.error);
        return data;
      });
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(function () {});
      return;
    }
    const input = document.createElement('textarea');
    input.value = text;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); } catch (error) {}
    document.body.removeChild(input);
  }

  function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (type ? ' is-' + type : '');
    toast.textContent = message;
    toastRegion.appendChild(toast);
    while (toastRegion.children.length > 2) {
      toastRegion.firstElementChild.remove();
    }
    window.setTimeout(function () { toast.remove(); }, 3800);
  }

  function setButtonBusy(button, busy, busyLabel) {
    if (!button) return;
    if (busy) {
      button.dataset.originalLabel = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="loading-line"><span class="loading-dot" aria-hidden="true"></span>' + esc(busyLabel || 'Memuat...') + '</span>';
    } else {
      button.disabled = false;
      if (button.dataset.originalLabel) {
        button.innerHTML = button.dataset.originalLabel;
        delete button.dataset.originalLabel;
      }
    }
  }

  function focusMain() {
    const main = document.getElementById('main');
    if (main) main.focus({ preventScroll: true });
  }

  function formatDate(iso) {
    if (!iso) return '';
    const date = new Date(iso);
    if (!isFinite(date.getTime())) return '';
    return new Intl.DateTimeFormat('id-ID', {
      day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta'
    }).format(date);
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    const date = new Date(iso);
    if (!isFinite(date.getTime())) return '';
    return new Intl.DateTimeFormat('id-ID', {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta'
    }).format(date) + ' WIB';
  }

  function formatDuration(seconds) {
    const value = Math.max(0, Number(seconds) || 0);
    const minutes = Math.floor(value / 60);
    const rest = value % 60;
    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const remaining = minutes % 60;
      return hours + ' jam' + (remaining ? ' ' + remaining + ' menit' : '');
    }
    if (minutes < 1) return rest + ' detik';
    return minutes + ' menit' + (rest ? ' ' + rest + ' detik' : '');
  }

  function formatClock(seconds) {
    const value = Math.max(0, Math.floor(Number(seconds) || 0));
    const hours = Math.floor(value / 3600);
    const minutes = Math.floor((value % 3600) / 60);
    const rest = value % 60;
    const pad = function (n) { return String(n).padStart(2, '0'); };
    return hours > 0 ? pad(hours) + ':' + pad(minutes) + ':' + pad(rest) : pad(minutes) + ':' + pad(rest);
  }

  function todayLabel(iso) {
    const date = new Date(iso || Date.now());
    return new Intl.DateTimeFormat('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta'
    }).format(date);
  }

  function dateKey(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  function themeToggleMarkup() {
    const next = state.theme === 'dark' ? 'terang' : 'gelap';

      (state.theme === 'dark' ? 'true' : 'false') + '">Mode ' + next + '</button>';
  }

  function topbarMarkup(options) {
    const opts = options || {};
    const data = state.dashboard;

    const name = data ? (data.role === 'teacher' ? '' : data.studentName) : '';

      '<button type="button" class="wordmark" data-action="' + (opts.homeAction || 'back-dashboard') + '">' +
        '<span class="wordmark-name">' + APP_NAME + '</span>' +
        '<span class="wordmark-note">Latihan matematika kelas 9</span>' +
      '</button>' +
      '<div class="topbar-actions">' +
        (role ? '<span class="role-chip">' + esc(role) + (name ? ' · <strong>' + esc(name) + '</strong>' : '') + '</span>' : '') +

      '</div>' +
    '</header>';
  }

  function footerMarkup() {
    return '<footer class="footer-note">' +
      '<span>Data latihan tersimpan di Google Sheets pada akun deployment.</span>' +
      '<span>' + APP_NAME + ' untuk persiapan ujian akhir SMP.</span>' +
    '</footer>';
  }

  function modeTag(mode) {
    if (mode === 'practice') return '<span class="mode-tag practice">Latihan</span>';
    return '<span class="mode-tag exam">Ujian</span>';
  }

  function render() {
    applyTheme(state.theme);
    document.body.classList.toggle('is-quiz', state.view === 'quiz');
    if (state.view === 'boot') return renderBoot();
    if (state.view === 'login') return renderLogin();
    if (state.view === 'dashboard') return renderDashboard();
    if (state.view === 'quiz') return renderQuiz();
    if (state.view === 'result') return renderResult();
    if (state.view === 'detail') return renderDetail();
    if (state.view === 'teacher-students') return renderTeacherStudents();
    if (state.view === 'teacher-questions') return renderTeacherQuestions();
    if (state.view === 'teacher-settings') return renderTeacherSettings();
    if (state.view === 'teacher-packages') return renderTeacherPackages();
    if (state.view === 'teacher-reports') return renderTeacherReports();
    if (state.view === 'live-host') return renderLiveHost();
    if (state.view === 'live-student') return renderLiveStudent();
    if (state.view === 'teacher-difficult') return renderDifficult();
    if (state.view === 'audit') return renderAudit();
    if (state.view === 'error') return renderError();
    return renderLogin();
  }

  function renderBoot() {
    app.innerHTML = '<div class="boot-screen"><div>' +
      '<div class="boot-mark" aria-hidden="true">RH</div>' +
      '<p class="boot-text">Menyiapkan ruang belajar...</p>' +
    '</div></div>';
  }

  function renderError() {
    app.innerHTML = '<main id="main" tabindex="-1" class="app-shell narrow">' +
      topbarMarkup({ homeAction: 'retry-boot', showLogout: false }) +
      '<div class="panel">' +
        '<h1>Ruang belajar belum bisa dibuka.</h1>' +

        '<button type="button" class="btn btn-primary" data-action="retry-boot">Coba muat ulang</button>' +
      '</div>' +
    '</main>';

  function renderLogin() {

    const intro = isTeacher

        ? 'Masukkan nama anak dan PIN orang tua yang diberikan guru.'
        : 'Masukkan nama dan PIN siswa yang diberikan guru.';

    app.innerHTML = '<main id="main" tabindex="-1" class="login-page">' +

                '<div class="field"><label for="login-secret">' + (role === 'parent' ? 'PIN orang tua' : 'PIN siswa') + '</label><div class="input-wrap"><input class="input" id="login-secret" name="login-secret" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="4 sampai 8 angka" required><button type="button" class="input-action" data-action="toggle-secret" data-target="login-secret" aria-label="Tampilkan PIN">Tampilkan</button></div><p class="field-hint">PIN diatur oleh guru. Jangan bagikan PIN kepada teman.</p></div>') +
            '<button type="submit" class="btn btn-primary btn-block">Masuk ke ruang ' + (role === 'teacher' ? 'guru' : 'belajar') + '</button>' +

    if (!state.dashboard) {
      state.view = 'boot';

    if (state.dashboard.role === 'parent') return renderParentDashboard();
    return renderStudentDashboard();

  function findPackage(id) {
    return (state.dashboard.packages || []).filter(function (p) { return p.id === id; })[0] || null;
  }

  function renderStudentDashboard() {
    const data = state.dashboard;
    const active = data.activeAttempt;
    const practiceMixed = findPackage('practice:mixed');
    const practiceTopics = (data.packages || []).filter(function (p) { return p.mode === 'practice' && p.kind === 'topik'; });
    const examFull = findPackage('exam:full');
    const examQuick = findPackage('exam:quick');
    const quizPkg = findPackage('quiz:live');
    const attempts = data.attempts || [];

    const activeMarkup = active ? '<div class="active-strip">' +
      '<div><strong>' + (active.mode === 'practice' ? 'Latihan sedang berjalan' : 'Ujian sedang berjalan') + '</strong><p>' + esc(active.packageTitle) + ' · ' + (active.mode === 'practice' ? 'tanpa batas waktu' : 'waktu berjalan') + '</p></div>' +
      '<button type="button" class="btn btn-primary btn-small" data-action="resume-attempt">Lanjutkan</button>' +
    '</div>' : '';

    const topicRows = practiceTopics.map(function (topic) {

      '</div>';
    }).join('');

    const historyMarkup = attempts.length ? '<div class="history-list">' + attempts.map(function (attempt) {
      const reviewLabel = attempt.mode === 'practice'
        ? 'Pembahasan terbuka'
        : attempt.reviewUnlocked ? 'Pembahasan terbuka' : attempt.reviewRequested ? 'Menunggu dibuka' : 'Pembahasan terkunci';
      const reviewClass = attempt.mode === 'practice' || attempt.reviewUnlocked ? 'is-open' : attempt.reviewRequested ? 'is-waiting' : '';

        '<div class="history-main"><h3>' + modeTag(attempt.mode) + ' ' + esc(attempt.packageTitle) + '</h3><p>' + esc(formatDateTime(attempt.submittedAt)) + ' · ' + esc(formatDuration(attempt.durationSec)) + '</p></div>' +

        '<div class="status-text ' + reviewClass + '">' + reviewLabel + '</div>' +
        '<button type="button" class="btn btn-ghost btn-small" data-action="open-result" data-attempt="' + esc(attempt.id) + '">Lihat hasil</button>' +
      '</div>';
    }).join('') + '</div>' : '<div class="empty-state"><strong>Belum ada latihan yang selesai.</strong><p>Mulai latihan pemahaman atau ujian pertama untuk melihat skor dan topik yang perlu diulang.</p></div>';

    app.innerHTML = '<main id="main" tabindex="-1" class="app-shell">' +
      topbarMarkup() +
      '<div class="page-head">' +
        '<div><div class="page-kicker"><span class="number">01</span><span>Ruang siswa</span></div><h1>Selamat belajar, ' + esc(data.studentName) + '.</h1></div>' +
        '<div class="date-note">' + esc(todayLabel(data.dateISO)) + '</div>' +

          ? '<span class="pending-badge">' + student.pendingReviews + ' perlu review</span>'
          : '<span class="status-text">Tidak ada permintaan</span>';

          '<div class="student-metric"><strong>' + student.attemptCount + '</strong> sesi</div>' +

            '<button type="button" class="btn btn-secondary btn-small" data-action="open-student" data-student="' + esc(student.id) + '">Lihat</button>' +

  function startLivePolling() {
    stopLivePolling();
    if (!state.live) return;
    state.livePollId = window.setInterval(function () {
      if (!state.live) return;
      api('getLiveState', state.token, state.live.id).then(function (live) {
        const hash = JSON.stringify({ s: live.status, i: live.currentIndex, a: live.answeredCount, p: live.participantCount, o: live.ownAnswer, l: live.leaderboard });
        const changed = hash !== state.liveHash;
        state.live = live;
        state.liveHash = hash;
        if (changed) {
          if (state.view === 'live-host') renderLiveHost();
          else if (state.view === 'live-student') renderLiveStudent();
        } else {
          updateLiveTimerDisplay();
        }
        if (live.status === 'ended') stopLivePolling();
      }).catch(function (error) {
        console.error(error);
      });
    }, 3000);
  }

  function stopLivePolling() {
    if (state.livePollId) {
      window.clearInterval(state.livePollId);
      state.livePollId = null;
    }
  }

  function startLiveClock() {
    if (state.liveClockId) window.clearInterval(state.liveClockId);
    state.liveClockId = window.setInterval(updateLiveTimerDisplay, 1000);
  }

  function stopLiveClock() {
    if (state.liveClockId) {
      window.clearInterval(state.liveClockId);
      state.liveClockId = null;
    }
  }

  function updateLiveTimerDisplay() {
    const el = document.getElementById('live-timer-value');
    if (!el || !state.live) return;
    if (state.live.status !== 'question' || !state.live.questionStartedAt) {
      el.textContent = '0';
      return;
    }
    const elapsed = (Date.now() - new Date(state.live.questionStartedAt).getTime()) / 1000;
    el.textContent = String(Math.max(0, Math.ceil(state.live.secondsPerQuestion - elapsed)));
  }

  function liveAction(action, target) {
    const live = state.live;
    if (!live) return;
    if (action === 'live-close') {
      stopLivePolling();
      stopLiveClock();
      state.live = null;
      state.liveHash = '';
      state.view = 'dashboard';
      loadDashboard();
      return;
    }
    if (action === 'live-answer') {
      const index = Number(target.getAttribute('data-index'));
      api('submitLiveAnswer', state.token, live.id, live.question.id, index).then(function () {
        state.live.ownAnswer = { selectedIndex: index, isCorrect: null };
        renderLiveStudent();
      }).catch(function (error) { showToast(error.message, 'error'); });
      return;
    }
    const calls = {
      'live-start': 'startLiveSession',
      'live-reveal': 'revealLiveAnswer',
      'live-next': 'nextLiveQuestion',
      'live-end': 'endLiveSession'
    };
    const fn = calls[action];
    if (!fn) return;
    api(fn, state.token, live.id).then(function (updated) {
      state.live = updated;
      state.liveHash = '';
      if (state.view === 'live-host') renderLiveHost();
      if (updated.status === 'ended') { stopLivePolling(); stopLiveClock(); }
    }).catch(function (error) { showToast(error.message, 'error'); });
  }
