  function reviewListMarkup(review, options) {
    if (!review.length) {
      return '<div class="empty-state"><strong>Belum ada pembahasan.</strong><p>Soal untuk sesi ini belum tersedia di bank soal.</p></div>';
    }
    const opts = options || {};
    return '<div class="review-list">' + review.map(function (item) {
      const verdict = item.selectedIndex == null ? 'Tidak dijawab' : item.isCorrect ? 'Benar' : 'Salah';
      const verdictClass = item.isCorrect ? 'correct' : 'wrong';
      const optionsMarkup = item.options.map(function (option, index) {
        let className = 'review-option';
        let tags = '';
        if (index === item.correctIndex) {
          className += ' is-correct';
          tags += '<span class="option-tag">Kunci</span>';
        }
        if (index === item.selectedIndex && index !== item.correctIndex) {
          className += ' is-selected-wrong';
          tags += '<span class="option-tag">Jawabanmu</span>';
        } else if (index === item.selectedIndex) {
          tags += '<span class="option-tag">Jawabanmu</span>';
        }
        return '<div class="' + className + '"><span class="letter">' + String.fromCharCode(65 + index) + '</span><span>' + esc(option) + tags + '</span></div>';
      }).join('');
      const flagButton = opts.attemptId
        ? '<div class="flag-row"><button type="button" class="btn btn-secondary btn-small" data-action="toggle-flag" data-attempt="' + esc(opts.attemptId) + '" data-question="' + esc(item.id) + '" data-flagged="' + (item.needsReview ? 'true' : 'false') + '">' + (item.needsReview ? 'Hapus tanda' : (state.role === 'student' ? 'Tandai belum paham' : 'Tandai untuk dibahas')) + '</button>' + (item.needsReview ? '<span class="flag-note">' + esc(item.flaggedBy || 'Ditandai') + (item.flagNote ? ': ' + esc(item.flagNote) : '') + '</span>' : '<span class="flag-note">Tandai soal yang perlu dibahas bersama.</span>') + '</div>'
        : '';
      return '<details class="review-item"><summary><span class="review-number">' + item.number + '</span><span class="review-summary-text"><strong>' + esc(item.question) + '</strong><span>' + esc(item.topicName) + ' · ' + esc(item.difficulty) + '</span></span><span class="review-verdict ' + verdictClass + '">' + verdict + '</span></summary><div class="review-body"><div class="review-question">' + esc(item.question) + '</div><div class="review-options">' + optionsMarkup + '</div><div class="solution"><strong>Langkah penyelesaian</strong>' + textBlock(item.solution) + '</div>' + flagButton + '</div></details>';
    }).join('') + '</div>';
  }

  function renderQuiz() {
    if (!state.attempt || !state.questions.length) {

    const attempt = state.attempt;
    const questions = state.questions;
    const index = Math.min(Math.max(0, state.index), questions.length - 1);
    const question = questions[index];
    const selected = state.answers[question.id];
    const answeredCount = Object.keys(state.answers).length;
    const progress = Math.round((answeredCount / questions.length) * 100);
    const isFirst = index === 0;
    const isLast = index === questions.length - 1;
    const isPractice = state.attemptMode === 'practice';

    const options = question.options.map(function (option, optionIndex) {
      const isSelected = selected === optionIndex;
      return '<label class="answer-option' + (isSelected ? ' is-selected' : '') + '">' +

        '<span class="option-text">' + esc(option) + '</span>' +

      const answered = Object.prototype.hasOwnProperty.call(state.answers, q.id);

    const timerMarkup = isPractice
      ? '<div class="quiz-no-timer">Tanpa batas waktu</div>'
      : '<div class="timer" id="timer" role="timer" aria-live="off"><span class="timer-note">Sisa</span><span id="timer-value">' + formatClock(remainingSeconds()) + '</span></div>';

    app.innerHTML = '<main id="main" tabindex="-1" class="app-shell">' +

          '<div class="quiz-top-row">' +

            timerMarkup +
          '</div>' +
          '<div class="progress-track" role="progressbar" aria-label="Soal terjawab" aria-valuemin="0" aria-valuemax="' + questions.length + '" aria-valuenow="' + answeredCount + '"><span style="width:' + progress + '%"></span></div>' +
        '</div>' +

          '<div class="question-meta"><span class="question-number">Soal ' + (index + 1) + '</span><span>' + esc(question.topicName) + ' · ' + esc(question.difficulty) + '</span></div>' +
          '<h1 class="question-text" id="question-text">' + esc(question.question) + '</h1>' +
          '<fieldset class="answer-list"><legend class="sr-only">Pilih satu jawaban</legend>' + options + '</fieldset>' +
          '<div class="quiz-save-status"><span id="save-status" aria-live="polite">' + (selected != null ? 'Jawaban tersimpan di perangkat ini.' : 'Pilih satu jawaban.') + '</span><span>' + answeredCount + ' dari ' + questions.length + ' terjawab</span></div>' +
        '</article>' +
        '<div class="quiz-footer">' +
          '<div class="quiz-footer-group"><button type="button" class="btn btn-ghost btn-small" data-action="quiz-exit">Keluar</button><button type="button" class="btn btn-secondary btn-small" data-action="quiz-map">Daftar soal</button></div>' +
          '<div class="quiz-footer-group"><button type="button" class="btn btn-secondary" data-action="quiz-prev"' + (isFirst ? ' disabled' : '') + '>Sebelumnya</button>' +
            (isLast ? '<button type="button" class="btn btn-primary" data-action="quiz-submit">Kumpulkan</button>' : '<button type="button" class="btn btn-primary" data-action="quiz-next">Berikutnya</button>') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<dialog class="modal" id="question-dialog" aria-labelledby="map-title"><div class="modal-inner"><h2 id="map-title">Daftar soal</h2><p>Soal yang sudah dijawab ditandai. Pilih nomor untuk berpindah.</p><div class="question-map">' + mapButtons + '</div><div class="map-legend"><span><i class="answered"></i>Sudah dijawab</span><span><i></i>Belum dijawab</span></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-map">Tutup</button><button type="button" class="btn btn-primary" data-action="quiz-submit">Kumpulkan</button></div></div></dialog>' +
    '</main>';

    if (isPractice) {
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = null;
      }
    } else {
      ensureTimer();
      updateTimerDisplay();
    }
    focusMain();
  }

  function remainingSeconds() {
    if (!state.timerEnd) return 0;
    return Math.max(0, Math.floor((state.timerEnd - Date.now()) / 1000));
  }

  function ensureTimer() {
    if (state.timerId) return;
    state.timerId = window.setInterval(function () {
      updateTimerDisplay();
      if (remainingSeconds() <= 0) {
        window.clearInterval(state.timerId);
        state.timerId = null;
        autoSubmit();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const timer = document.getElementById('timer');
    const value = document.getElementById('timer-value');
    if (!timer || !value) return;
    const left = remainingSeconds();
    value.textContent = formatClock(left);
    timer.classList.toggle('is-urgent', left <= 300);
    timer.setAttribute('aria-label', 'Sisa waktu ' + formatClock(left) + (left <= 300 ? ', waktu hampir habis' : ''));
  }

  function loadDashboard(options) {
    const opts = options || {};
    return api('getDashboard', state.token).then(function (data) {
      state.dashboard = data;
      state.role = data.role;
      state.view = opts.view || 'dashboard';
      render();
      return data;
    }).catch(function (error) {
      if (/sesi/i.test(error.message)) {
        clearSession();
        state.loginMessage = 'Sesi berakhir. Masuk kembali dengan nama dan PIN.';
        state.view = 'login';
        render();
        return null;
      }
      if (opts.silent) {
        showToast(error.message, 'error');
        return null;
      }
      state.bootError = error.message;
      state.view = 'error';
      render();
      return null;
    });
  }

  function boot() {
    applyTheme(state.theme);
    if (!state.token) {
      state.view = 'login';
      render();
      return;
    }
    renderBoot();
    api('getDashboard', state.token).then(function (data) {
      state.dashboard = data;
      state.role = data.role;
      state.view = 'dashboard';
      render();
    }).catch(function (error) {
      clearSession();
      state.loginMessage = /sesi/i.test(error.message) ? 'Sesi berakhir. Masuk kembali dengan nama dan PIN.' : '';
      state.view = 'login';
      render();
    });
  }

  function clearSession() {
    state.token = null;
    state.dashboard = null;
    state.attempt = null;
    state.questions = [];
    state.answers = {};
    state.result = null;
    state.detail = null;
    state.upload = { fileName: '', rows: [], errors: [] };
    storage.remove(SESSION_KEY);
    if (state.timerId) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    stopReminderWatcher();
    stopLivePolling();
    stopLiveClock();
    state.live = null;
    state.liveHash = '';
  }

  function handleLogin(form) {
    const role = state.loginRole;
    const isTeacher = role === 'teacher';
    const nameInput = $('#login-name');
    const secretInput = isTeacher ? $('#login-code') : $('#login-secret');
    const name = isTeacher ? '' : (nameInput ? nameInput.value.trim() : '');
    const secret = secretInput ? secretInput.value.trim() : '';
    const button = $('button[type="submit"]', form);

    if (!isTeacher && !name) {
      state.loginMessage = 'Masukkan nama siswa terlebih dahulu.';
      renderLogin();
      return;
    }
    if (!secret) {
      state.loginMessage = isTeacher ? 'Masukkan kode guru.' : 'Masukkan PIN.';
      renderLogin();
      return;
    }

    state.loginMessage = '';
    setButtonBusy(button, true, 'Memeriksa...');
    api('login', role, name, secret).then(function (data) {
      state.token = data.token;
      state.role = data.role;
      storage.set(SESSION_KEY, data.token);
      state.reminderPromptShown = false;
      return loadDashboard();
    }).then(function () {
      if (state.dashboard) showToast('Selamat datang, ' + (state.dashboard.studentName || state.dashboard.name) + '.', 'success');
    }).catch(function (error) {
      state.loginMessage = error.message;
      setButtonBusy(button, false);
      renderLogin();
    });
  }

  function startPackage(packageId) {
    if (state.submitting) return;
    state.submitting = true;
    api('startAttempt', state.token, packageId).then(function (data) {
      beginAttempt(data);
    }).catch(function (error) {
      showToast(error.message, 'error');
      if (/sedang berjalan/i.test(error.message)) loadDashboard({ silent: true });
    }).finally(function () {
      state.submitting = false;
    });
  }

  function resumeAttempt() {
    if (!state.dashboard || !state.dashboard.activeAttempt || state.submitting) return;
    state.submitting = true;
    api('resumeAttempt', state.token, state.dashboard.activeAttempt.id).then(function (data) {
      if (data.finished) {
        state.result = data.result;
        state.view = 'result';
        render();
        return;
      }
      beginAttempt(data);
    }).catch(function (error) {
      showToast(error.message, 'error');
    }).finally(function () {
      state.submitting = false;
    });
  }

  function beginAttempt(data) {
    state.attempt = data.attempt;
    state.attemptMode = data.mode || data.attempt.mode;
    state.questions = data.questions || [];
    state.answers = {};
    (data.questions || []).forEach(function (q) {
      if (data.answers && Object.prototype.hasOwnProperty.call(data.answers, q.id)) {
        state.answers[q.id] = Number(data.answers[q.id]);
      }
    });
    state.index = 0;
    state.timerEnd = state.attemptMode === 'exam' && data.remainingSec != null
      ? Date.now() + Math.max(0, Number(data.remainingSec) || 0) * 1000
      : 0;
    state.view = 'quiz';
    state.submitting = false;
    state.saveQueue = Promise.resolve();
    state.pendingSaves = 0;
    if (state.timerId) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    render();
  }

  function selectAnswer(questionId, value) {
    const index = Number(value);
    if (!isFinite(index) || index < 0 || index > 3) return;
    state.answers[questionId] = index;
    $all('.answer-option').forEach(function (label) {
      const input = $('input', label);
      label.classList.toggle('is-selected', input && Number(input.value) === index);
    });
    const answeredCount = Object.keys(state.answers).length;
    const progress = document.querySelector('.progress-track');
    if (progress) {
      progress.setAttribute('aria-valuenow', String(answeredCount));
      const bar = $('span', progress);
      if (bar) bar.style.width = Math.round((answeredCount / state.questions.length) * 100) + '%';
    }
    const status = $('#save-status');
    if (status) status.textContent = 'Menyimpan jawaban...';
    queueSave(questionId, index);
  }

  function queueSave(questionId, index) {
    state.pendingSaves += 1;
    state.saveQueue = state.saveQueue.then(function () {
      return api('saveAnswer', state.token, state.attempt.id, questionId, index).then(function (response) {
        state.pendingSaves -= 1;
        if (response && response.expired) {
          updateSaveStatus();
          handleExpired();
          return;
        }
        updateSaveStatus();
      }).catch(function (error) {
        state.pendingSaves -= 1;
        const status = $('#save-status');
        if (status) {
          status.textContent = 'Jawaban belum tersimpan. Pilih ulang jawaban.';
          status.classList.remove('saved');
        }
        showToast('Jawaban belum tersimpan. Periksa koneksi lalu pilih ulang jawaban.', 'error');
        console.error(error);
      });
    });
  }

  function updateSaveStatus() {
    const status = $('#save-status');
    if (!status) return;
    if (state.pendingSaves > 0) {
      status.textContent = 'Menyimpan jawaban...';
      status.classList.remove('saved');
    } else {
      status.textContent = 'Tersimpan.';
      status.classList.add('saved');
    }
  }

  function handleExpired() {
    if (state.submitting) return;
    state.submitting = true;
    showToast('Waktu habis. Jawaban dikumpulkan otomatis.', 'error');
    api('submitAttempt', state.token, state.attempt.id, 'timeout').then(function (result) {
      result.timeout = true;
      state.result = result;
      state.view = 'result';
      state.attempt = null;
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = null;
      }
      render();
    }).catch(function (error) {
      showToast(error.message, 'error');
      state.view = 'dashboard';
      loadDashboard({ silent: true });
    }).finally(function () {
      state.submitting = false;
    });
  }

  function submitQuiz(reason) {
    if (state.submitting) return;
    const unanswered = state.questions.length - Object.keys(state.answers).length;
    const isPractice = state.attemptMode === 'practice';
    const confirmPromise = reason === 'timeout' ? Promise.resolve(true) : confirmDialog({
      title: isPractice ? 'Kumpulkan latihan ini?' : 'Kumpulkan ujian ini?',
      message: unanswered > 0
        ? 'Masih ada ' + unanswered + ' soal yang belum dijawab. Jawaban kosong akan dihitung salah.'
        : isPractice
          ? 'Semua soal sudah dijawab. Pembahasan akan langsung terbuka setelah dikumpulkan.'
          : 'Semua soal sudah dijawab. Setelah dikumpulkan, skor dihitung dan pembahasan menunggu persetujuan guru atau orang tua.',
      confirmLabel: 'Ya, kumpulkan',
      cancelLabel: 'Periksa lagi',
      danger: unanswered > 0
    });

    confirmPromise.then(function (confirmed) {
      if (!confirmed) return;
      state.submitting = true;
      const submitButton = $('[data-action="quiz-submit"]');
      if (submitButton) setButtonBusy(submitButton, true, 'Mengumpulkan...');
      return state.saveQueue.then(function () {
        return api('submitAttempt', state.token, state.attempt.id, reason === 'timeout' ? 'timeout' : 'manual');
      }).then(function (result) {
        result.timeout = reason === 'timeout';
        state.result = result;
        state.view = 'result';
        state.attempt = null;
        state.questions = [];
        if (state.timerId) {
          window.clearInterval(state.timerId);
          state.timerId = null;
        }
        render();
      }).catch(function (error) {
        showToast(error.message, 'error');
        setButtonBusy(submitButton, false);
      }).finally(function () {
        state.submitting = false;
      });
    });
  }

  function autoSubmit() {
    if (state.view !== 'quiz' || state.attemptMode !== 'exam' || state.submitting) return;
    submitQuiz('timeout');
  }

  function confirmDialog(options) {
    return new Promise(function (resolve) {
      const dialog = document.createElement('dialog');
      dialog.className = 'modal';
      dialog.innerHTML = '<div class="modal-inner"><h2>' + esc(options.title) + '</h2><p>' + esc(options.message) + '</p><div class="modal-actions"><button type="button" class="btn btn-secondary" data-dialog-cancel>' + esc(options.cancelLabel || 'Batal') + '</button><button type="button" class="btn ' + (options.danger ? 'btn-danger' : 'btn-primary') + '" data-dialog-confirm>' + esc(options.confirmLabel || 'Lanjutkan') + '</button></div></div>';
      document.body.appendChild(dialog);
      const close = function (value) {
        if (dialog.open) dialog.close();
        resolve(value);
        window.setTimeout(function () { dialog.remove(); }, 0);
      };
      $('[data-dialog-cancel]', dialog).addEventListener('click', function () { close(false); });
      $('[data-dialog-confirm]', dialog).addEventListener('click', function () { close(true); });
      dialog.addEventListener('cancel', function (event) { event.preventDefault(); close(false); });
      dialog.addEventListener('click', function (event) { if (event.target === dialog) close(false); });
      dialog.showModal();
      const confirmButton = $('[data-dialog-confirm]', dialog);
      if (confirmButton) confirmButton.focus();
    });
  }

  function openResult(attemptId) {
    api('getResult', state.token, attemptId).then(function (data) {
      state.result = data;
      state.view = 'result';
      render();
    }).catch(function (error) { showToast(error.message, 'error'); });
  }

  function openStudent(studentId) {
    api('getStudentDetail', state.token, studentId).then(function (data) {
      state.detail = data;
      state.view = 'detail';
      render();
    }).catch(function (error) { showToast(error.message, 'error'); });
  }

  function toggleReview(attemptId, unlocked, button) {
    setButtonBusy(button, true, unlocked ? 'Membuka...' : 'Menutup...');
    api('setReviewUnlocked', state.token, attemptId, unlocked).then(function () {
      showToast(unlocked ? 'Pembahasan dibuka untuk siswa.' : 'Pembahasan ditutup kembali.', 'success');
      if (state.view === 'detail' && state.detail && state.detail.student) {
        return api('getStudentDetail', state.token, state.detail.student.id).then(function (data) {
          state.detail = data;
          render();
        });
      }
      return loadDashboard({ silent: true });
    }).catch(function (error) {
      showToast(error.message, 'error');
      setButtonBusy(button, false);
    });
  }

  function requestReview(attemptId, button) {
    setButtonBusy(button, true, 'Mengirim...');
    api('requestReview', state.token, attemptId).then(function () {
      state.result.reviewRequested = true;
      render();
      showToast('Permintaan review sudah dikirim.', 'success');
    }).catch(function (error) {
      showToast(error.message, 'error');
      setButtonBusy(button, false);
    });
  }

  function saveTeacherCode(form) {
    const input = $('#teacher-code');
    const button = $('button[type="submit"]', form);
    setButtonBusy(button, true, 'Menyimpan...');
    api('updateTeacherCode', state.token, input.value).then(function (data) {
      state.dashboard.teacherCode = data.teacherCode;
      showToast('Kode guru diperbarui.', 'success');
      render();
    }).catch(function (error) {
      showToast(error.message, 'error');
      setButtonBusy(button, false);
    });
  }

  function openStudentModal(student) {
    const isEdit = !!student;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal student-modal';
    dialog.innerHTML = '<div class="modal-inner">' +
      '<h2>' + (isEdit ? 'Atur siswa' : 'Tambah siswa') + '</h2>' +
      '<p>' + (isEdit ? 'Kosongkan PIN jika tidak ingin mengubahnya.' : 'Tentukan nama dan dua PIN. Berikan PIN kepada siswa dan orang tua.') + '</p>' +
      '<form id="student-form">' +
        '<div class="form-grid">' +
          '<div class="field full"><label for="sf-name">Nama siswa</label><input class="input" id="sf-name" type="text" maxlength="40" value="' + esc(isEdit ? student.name : '') + '" required></div>' +
          '<div class="field"><label for="sf-student-pin">PIN siswa</label><input class="input" id="sf-student-pin" type="text" inputmode="numeric" maxlength="8" placeholder="' + (isEdit ? 'Kosongkan jika tetap' : '4 sampai 8 angka') + '"' + (isEdit ? '' : ' required') + '></div>' +
          '<div class="field"><label for="sf-parent-pin">PIN orang tua</label><input class="input" id="sf-parent-pin" type="text" inputmode="numeric" maxlength="8" placeholder="' + (isEdit ? 'Kosongkan jika tetap' : '4 sampai 8 angka') + '"' + (isEdit ? '' : ' required') + '></div>' +
          (isEdit ? '<div class="field full checkbox-row"><input type="checkbox" id="sf-active"' + (student.active ? ' checked' : '') + '> <span>Akun siswa aktif dan boleh masuk.</span></div>' : '') +
        '</div>' +
        '<div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Batal</button><button type="submit" class="btn btn-primary">Simpan siswa</button></div>' +
      '</form>' +
    '</div>';
    document.body.appendChild(dialog);
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) closeDialog(dialog);
    });
    dialog.addEventListener('cancel', function () { dialog.remove(); });
    dialog.querySelector('form').addEventListener('submit', function (event) {
      event.preventDefault();
      const name = $('#sf-name').value.trim();
      const studentPin = $('#sf-student-pin').value.trim();
      const parentPin = $('#sf-parent-pin').value.trim();
      const active = isEdit ? $('#sf-active').checked : true;
      if (name.length < 2) { showToast('Nama siswa minimal 2 karakter.', 'error'); return; }
      if (!isEdit && !/^\d{4,8}$/.test(studentPin)) { showToast('PIN siswa harus 4 sampai 8 angka.', 'error'); return; }
      if (!isEdit && !/^\d{4,8}$/.test(parentPin)) { showToast('PIN orang tua harus 4 sampai 8 angka.', 'error'); return; }
      if (studentPin && !/^\d{4,8}$/.test(studentPin)) { showToast('PIN siswa harus 4 sampai 8 angka.', 'error'); return; }
      if (parentPin && !/^\d{4,8}$/.test(parentPin)) { showToast('PIN orang tua harus 4 sampai 8 angka.', 'error'); return; }
      const button = $('button[type="submit"]', event.target);
      setButtonBusy(button, true, 'Menyimpan...');
      api('saveStudent', state.token, {
        id: isEdit ? student.id : '',
        name: name,
        studentPin: studentPin,
        parentPin: parentPin,
        active: active
      }).then(function () {
        closeDialog(dialog);
        showToast(isEdit ? 'Data siswa diperbarui.' : 'Siswa ditambahkan.', 'success');
        return loadDashboard({ view: 'teacher-students' });
      }).catch(function (error) {
        showToast(error.message, 'error');
        setButtonBusy(button, false);
      });
    });
    dialog.showModal();
    const first = $('#sf-name', dialog);
    if (first) first.focus();
  }

  function closeDialog(dialog) {
    if (dialog && dialog.open) dialog.close();
    if (dialog) window.setTimeout(function () { dialog.remove(); }, 0);
  }

  function openTeacherView(view) {
    state.view = view;
    render();
  }

  function maybeShowReminderPrompt() {
    if (state.role !== 'student' || !state.dashboard || state.reminderPromptShown) return;
    const studentId = state.dashboard.studentId;
    const key = 'rh_reminder_prompt_' + studentId;
    const last = Number(local.get(key) || 0);
    if (last && Date.now() - last < 7 * 86400000) return;
    state.reminderPromptShown = true;

    const dialog = document.createElement('dialog');
    dialog.className = 'modal';
    dialog.innerHTML = '<div class="modal-inner">' +
      '<h2>Pengingat latihan 19.45</h2>' +
      '<p>Simpan pengingat harian ke kalender perangkat agar tetap diingat saat aplikasi ditutup. Kamu juga bisa menyalakan notifikasi saat aplikasi sedang terbuka.</p>' +
      '<div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-primary" data-reminder-calendar>Simpan ke kalender</button>' +
        '<button type="button" class="btn btn-secondary" data-reminder-notify>Nyalakan notifikasi</button>' +
        '<button type="button" class="btn btn-ghost" data-reminder-later>Nanti</button>' +
      '</div>' +
    '</div>';
    document.body.appendChild(dialog);

    const finish = function (action) {
      if (action === 'later') {
        local.set(key, String(Date.now()));
      } else {
        local.set(key, String(Date.now() + 23 * 86400000));
      }
      closeDialog(dialog);
    };

    $('[data-reminder-calendar]', dialog).addEventListener('click', function () {
      downloadReminderIcs();
      local.set('rh_calendar_' + studentId, '1');
      finish('calendar');
      showToast('File pengingat kalender diunduh. Buka file untuk menyimpannya.', 'success');
    });
    $('[data-reminder-notify]', dialog).addEventListener('click', function () {
      enableNotifications(studentId).then(function (granted) {
        if (granted) {
          finish('notify');
          showToast('Notifikasi browser aktif saat aplikasi terbuka.', 'success');
        } else {
          showToast('Browser tidak mengizinkan notifikasi. Gunakan pengingat kalender.', 'error');
        }
      });
    });
    $('[data-reminder-later]', dialog).addEventListener('click', function () { finish('later'); });
    dialog.addEventListener('cancel', function (event) { event.preventDefault(); finish('later'); });
    dialog.addEventListener('click', function (event) { if (event.target === dialog) finish('later'); });
    dialog.showModal();
    const calendarButton = $('[data-reminder-calendar]', dialog);
    if (calendarButton) calendarButton.focus();
  }

  function reminderPanelMarkup() {
    if (state.role !== 'student' || !state.dashboard) return '';
    const studentId = state.dashboard.studentId;
    const hasCalendar = local.get('rh_calendar_' + studentId) === '1';
    const notifyOn = 'Notification' in window && Notification.permission === 'granted' && local.get('rh_notify_' + studentId) === '1';
    return '<section class="reminder-panel" aria-labelledby="reminder-title">' +
      '<div><h2 id="reminder-title">Pengingat harian 19.45</h2><p>' + (hasCalendar ? 'File kalender sudah diunduh. Jika belum, buka file .ics di perangkat untuk menyimpan acara harian.' : 'Simpan ke kalender perangkat agar tetap diingat walau aplikasi ditutup.') + (notifyOn ? ' Notifikasi browser juga aktif saat aplikasi terbuka.' : '') + '</p></div>' +
      '<div class="reminder-actions">' +
        '<button type="button" class="btn btn-secondary btn-small" data-action="download-reminder">Simpan ke kalender</button>' +
        '<button type="button" class="btn btn-ghost btn-small" data-action="enable-notifications">Nyalakan notifikasi</button>' +
      '</div>' +
    '</section>';
  }

  function downloadReminderIcs() {
    if (!state.dashboard) return;
    const studentId = state.dashboard.studentId;
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 19, 45, 0, 0);
    if (start.getTime() <= now.getTime()) start.setDate(start.getDate() + 1);
    const end = new Date(start.getTime() + 30 * 60000);
    const pad = function (n) { return String(n).padStart(2, '0'); };
    const localDate = function (d) {
      return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
    };
    const utcStamp = function (d) {
      return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
    };
    const uid = 'ruang-hitung-' + studentId + '@ruang-hitung';
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Ruang Hitung//Latihan Matematika//ID',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + uid,
      'DTSTAMP:' + utcStamp(now),
      'DTSTART:' + localDate(start),
      'DTEND:' + localDate(end),
      'RRULE:FREQ=DAILY',
      'SUMMARY:Latihan Matematika - Ruang Hitung',
      'DESCRIPTION:Waktunya latihan soal matematika. Buka ' + APP_URL,
      'URL:' + APP_URL,
      'BEGIN:VALARM',
      'TRIGGER:-PT10M',
      'ACTION:DISPLAY',
      'DESCRIPTION:Latihan Matematika 19.45',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ];
    downloadText('pengingat-ruang-hitung.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  }

  function enableNotifications(studentId) {
    if (!('Notification' in window)) {
      return Promise.resolve(false);
    }
    if (Notification.permission === 'granted') {
      local.set('rh_notify_' + studentId, '1');
      return Promise.resolve(true);
    }
    return Notification.requestPermission().then(function (permission) {
      if (permission === 'granted') {
        local.set('rh_notify_' + studentId, '1');
        return true;
      }
      return false;
    }).catch(function () { return false; });
  }

  function startReminderWatcher() {
    stopReminderWatcher();
    if (state.role !== 'student' || !state.dashboard) return;
    state.reminderTimerId = window.setInterval(checkReminderTime, 30000);
    checkReminderTime();
  }

  function stopReminderWatcher() {
    if (state.reminderTimerId) {
      window.clearInterval(state.reminderTimerId);
      state.reminderTimerId = null;
    }
  }

  function checkReminderTime() {
    if (state.role !== 'student' || !state.dashboard) return;
    const now = new Date();
    if (now.getHours() !== 19 || now.getMinutes() < 45 || now.getMinutes() > 50) return;
    const key = 'rh_last_inapp_' + state.dashboard.studentId;
    if (local.get(key) === dateKey(now)) return;
    local.set(key, dateKey(now));
    showToast('Waktunya latihan matematika 19.45. Mulai dari satu topik yang ingin diperkuat.', 'success');
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        new Notification('Ruang Hitung', { body: 'Waktunya latihan matematika 19.45.' });
      } catch (error) { /* fallback toast sudah tampil */ }
    }
  }

  function downloadQuestionTemplate() {
    const lines = [
      '# Format impor soal Ruang Hitung',
      '# topicId: bilangan, aljabar, fungsi, geometri, statistika, perbandingan',
      '# answer: A, B, C, atau D',
      '# difficulty: Mudah, Sedang, Tantangan',
      '# Baris berawalan # diabaikan. Untuk pembahasan multi-baris, gunakan tanda kutip.',
      'topicId,id,question,difficulty,optionA,optionB,optionC,optionD,answer,solution',
      '# contoh,bilangan,,Hasil dari 2 + 2 adalah ...,Mudah,2,3,4,5,C,2 + 2 = 4.',
      '# contoh,aljabar,,Akar dari x^2 - 9 = 0 adalah ...,Sedang,-3 dan 3,-9 dan 9,3 dan 3,-3 dan -3,A,"x^2 - 9 = (x - 3)(x + 3), sehingga akarnya -3 dan 3."'
    ];
    downloadText('format-soal-ruang-hitung.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  }

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    window.setTimeout(function () {
      URL.revokeObjectURL(url);
      link.remove();
    }, 1500);
  }

  function parseCsvText(text) {
    let clean = String(text || '').replace(/^\uFEFF/, '');
    const firstLine = clean.split(/\r?\n/).filter(function (line) {
      return line.trim() && !line.trim().startsWith('#');
    })[0] || '';
    const delimiter = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < clean.length; i++) {
      const char = clean[i];
      if (inQuotes) {
        if (char === '"') {
          if (clean[i + 1] === '"') {
            field += '"';
            i += 1;
          } else {
            inQuotes = false;
          }
        } else {
          field += char;
        }
      } else if (char === '"') {
        inQuotes = true;
      } else if (char === delimiter) {
        row.push(field);
        field = '';
      } else if (char === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else if (char !== '\r') {
        field += char;
      }
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }

    let headerIndex = -1;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].some(function (cell) { return cell.trim().toLowerCase() === 'topicid'; })) {
        headerIndex = i;
        break;
      }
    }
    if (headerIndex < 0) {
      return { rows: [], errors: ['Header topicId tidak ditemukan. Unduh format CSV dari halaman ini.'] };
    }

    const headerMap = {};
    rows[headerIndex].forEach(function (header, index) {
      const key = String(header || '').trim().toLowerCase().replace(/\s+/g, '');
      const map = {
        topicid: 'topicId', id: 'id', question: 'question', difficulty: 'difficulty',
        optiona: 'optionA', optionb: 'optionB', optionc: 'optionC', optiond: 'optionD',
        answer: 'answer', solution: 'solution'
      };
      if (map[key]) headerMap[index] = map[key];
    });

    const required = ['topicId', 'question', 'optionA', 'optionB', 'optionC', 'optionD', 'answer', 'solution'];
    const present = Object.keys(headerMap).map(function (i) { return headerMap[i]; });
    const missing = required.filter(function (key) { return present.indexOf(key) === -1; });
    if (missing.length) {
      return { rows: [], errors: ['Kolom wajib belum ada: ' + missing.join(', ') + '.'] };
    }

    const parsed = [];
    for (let i = headerIndex + 1; i < rows.length; i++) {
      const cells = rows[i];
      if (!cells || !cells.some(function (cell) { return String(cell).trim(); })) continue;
      if (String(cells[0] || '').trim().startsWith('#')) continue;
      const item = {};
      Object.keys(headerMap).forEach(function (index) {
        item[headerMap[index]] = String(cells[index] == null ? '' : cells[index]).trim();
      });
      parsed.push(item);
    }

    if (!parsed.length) {
      return { rows: [], errors: ['File tidak memuat baris soal. Isi data setelah baris header.'] };
    }
    if (parsed.length > 500) {
      return { rows: [], errors: ['Maksimal 500 soal per impor.'] };
    }
    return { rows: parsed, errors: [] };
  }

  function handleQuestionFile(file) {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      state.upload = { fileName: file.name, rows: [], errors: ['Ukuran file maksimal 2 MB.'] };
      render();
      return;
    }
    const reader = new FileReader();
    reader.onload = function () {
      const parsed = parseCsvText(reader.result);
      state.upload = { fileName: file.name, rows: parsed.rows, errors: parsed.errors };
      render();
      if (parsed.errors.length) showToast(parsed.errors[0], 'error');
      else showToast(parsed.rows.length + ' soal terbaca. Periksa preview sebelum impor.', 'success');
    };
    reader.onerror = function () {
      state.upload = { fileName: file.name, rows: [], errors: ['File tidak bisa dibaca.'] };
      render();
    };
    reader.readAsText(file, 'utf-8');
  }

  function importQuestionRows() {
    if (!state.upload.rows.length) return;
    const replace = $('#replace-bank') && $('#replace-bank').checked;
    const doImport = function () {
      const button = $('[data-action="import-questions"]');
      setButtonBusy(button, true, 'Mengimpor...');
      api('importQuestions', state.token, state.upload.rows, replace).then(function (result) {
        if (!result.ok) {
          state.upload.errors = result.errors || ['Impor gagal.'];
          render();
          showToast('Ada baris yang perlu diperbaiki.', 'error');
          return;
        }
        state.upload = { fileName: '', rows: [], errors: [] };
        showToast(result.imported + ' soal diimpor.', 'success');
        return loadDashboard({ view: 'teacher-questions' });
      }).catch(function (error) {
        showToast(error.message, 'error');
        setButtonBusy(button, false);
      });
    };
    if (replace) {
      confirmDialog({
        title: 'Ganti seluruh bank soal?',
        message: 'Semua soal lama akan dihapus dan diganti dengan ' + state.upload.rows.length + ' soal dari file ini. Tindakan ini tidak bisa dibatalkan.',
        confirmLabel: 'Ya, ganti bank soal',
        cancelLabel: 'Batal',
        danger: true
      }).then(function (confirmed) { if (confirmed) doImport(); });
    } else {
      doImport();
    }
  }

  function logout() {
    const token = state.token;
    clearSession();
    state.view = 'login';
    state.loginMessage = '';
    render();
    if (token) api('logout', token).catch(function () { /* local session already cleared */ });
  }

  function openQuestionMap() {
    const dialog = document.getElementById('question-dialog');
    if (dialog && !dialog.open) dialog.showModal();
  }

  function closeQuestionMap() {
    const dialog = document.getElementById('question-dialog');
    if (dialog && dialog.open) dialog.close();
  }

  function goToQuestion(index) {
    if (!state.questions.length) return;
    state.index = Math.min(Math.max(0, index), state.questions.length - 1);
    closeQuestionMap();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function exitQuiz() {
    confirmDialog({
      title: 'Keluar dari sesi?',
      message: 'Jawaban yang sudah dipilih tetap tersimpan, dan kamu bisa melanjutkan sesi ini nanti dari ruang belajar.',
      confirmLabel: 'Keluar ke ruang belajar',
      cancelLabel: 'Lanjut mengerjakan'
    }).then(function (confirmed) {
      if (!confirmed) return;
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = null;
      }
      state.attempt = null;
      state.questions = [];
      state.answers = {};
      loadDashboard({ silent: true });
    });
  }

  function handleClick(event) {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');

    if (action === 'toggle-theme') {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      target.textContent = 'Mode ' + (state.theme === 'dark' ? 'terang' : 'gelap');
      target.setAttribute('aria-pressed', state.theme === 'dark' ? 'true' : 'false');
      return;
    }

    if (action === 'toggle-secret') {
      const input = document.getElementById(target.getAttribute('data-target'));
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      target.textContent = showing ? 'Tampilkan' : 'Sembunyikan';
      input.focus();
      return;
    }

    if (action === 'login-role') {
      state.loginRole = target.getAttribute('data-role');
      state.loginMessage = '';
      renderLogin();
      return;
    }

    if (action === 'logout') { logout(); return; }
    if (action === 'retry-boot') { boot(); return; }

    if (action === 'back-dashboard') {
      if (state.view === 'quiz') { exitQuiz(); return; }
      if (state.live) {
        stopLivePolling();
        stopLiveClock();
        state.live = null;
        state.liveHash = '';
      }
      state.result = null;
      state.detail = null;
      loadDashboard();
      return;
    }

    if (action === 'start-package') {
      startPackage(target.getAttribute('data-package'));
      return;
    }
    if (action === 'resume-attempt') { resumeAttempt(); return; }
    if (action === 'open-result') { openResult(target.getAttribute('data-attempt')); return; }
    if (action === 'open-student') { openStudent(target.getAttribute('data-student')); return; }

    if (action === 'open-teacher-students') { openTeacherView('teacher-students'); return; }
    if (action === 'open-teacher-questions') { openTeacherQuestionsView(); return; }
    if (action === 'open-teacher-packages') { openTeacherPackages(); return; }
    if (action === 'open-teacher-reports') { openTeacherReports(); return; }
    if (action === 'generate-report') { generateReportUI(target.getAttribute('data-report-type') || 'student'); return; }
    if (action === 'join-live') { openJoinLive(); return; }
    if (action === 'start-live-host') { startLiveHost(); return; }
    if (['live-start','live-reveal','live-next','live-end','live-answer','live-close'].indexOf(action) !== -1) { liveAction(action, target); return; }
    if (action === 'add-question') { openQuestionModal(null); return; }
    if (action === 'edit-question') { const q = (state.teacherQuestions || []).filter(function (x) { return x.id === target.getAttribute('data-question'); })[0]; if (q) openQuestionModal(q); return; }
    if (action === 'add-package') { openPackageModal(null); return; }
    if (action === 'edit-package') { const p = (state.teacherPackages || []).filter(function (x) { return x.id === target.getAttribute('data-package'); })[0]; if (p) openPackageModal(p); return; }
    if (action === 'open-teacher-settings') { openTeacherView('teacher-settings'); return; }
    if (action === 'add-student') { openStudentModal(null); return; }
    if (action === 'edit-student') {
      const student = findStudent(target.getAttribute('data-student'));
      if (student) openStudentModal(student);
      return;
    }
    if (action === 'close-modal') {
      const dialog = target.closest('dialog');
      if (dialog) closeDialog(dialog);
      return;
    }

    if (action === 'toggle-review') {
      toggleReview(target.getAttribute('data-attempt'), target.getAttribute('data-unlock') === 'true', target);
      return;
    }
    if (action === 'toggle-flag') {
      toggleFlag(target.getAttribute('data-attempt'), target.getAttribute('data-question'), target.getAttribute('data-flagged') === 'true', target);
      return;
    }
    if (action === 'open-difficult') { openDifficult(); return; }
    if (action === 'open-audit') { openAudit(); return; }
    if (action === 'install-help') { openInstallHelp(); return; }
    if (action === 'copy-app-link') {
      copyText(APP_URL);
      showToast('Link aplikasi disalin. Bagikan link ini, bukan link Google Drive.', 'success');
      return;
    }
    if (action === 'share-app') {
      if (navigator.share) {
        navigator.share({ title: 'Ruang Hitung', text: 'Latihan soal matematika kelas 9', url: APP_URL }).catch(function () { copyText(APP_URL); showToast('Link aplikasi disalin.', 'success'); });
      } else {
        copyText(APP_URL);
        showToast('Link aplikasi disalin.', 'success');
      }
      return;
    }
    if (action === 'request-review') { requestReview(target.getAttribute('data-attempt'), target); return; }

    if (action === 'quiz-prev') { if (state.index > 0) goToQuestion(state.index - 1); return; }
    if (action === 'quiz-next') { if (state.index < state.questions.length - 1) goToQuestion(state.index + 1); return; }
    if (action === 'quiz-map') { openQuestionMap(); return; }
    if (action === 'jump-question') { goToQuestion(Number(target.getAttribute('data-index'))); return; }
    if (action === 'close-map') { closeQuestionMap(); return; }
    if (action === 'quiz-submit') { closeQuestionMap(); submitQuiz('manual'); return; }
    if (action === 'quiz-exit') { exitQuiz(); return; }

    if (action === 'download-template') { downloadQuestionTemplate(); return; }
    if (action === 'import-questions') { importQuestionRows(); return; }
    if (action === 'clear-upload') { state.upload = { fileName: '', rows: [], errors: [] }; render(); return; }
    if (action === 'download-reminder') { downloadReminderIcs(); showToast('File pengingat kalender diunduh.', 'success'); return; }
    if (action === 'enable-notifications') {
      enableNotifications(state.dashboard.studentId).then(function (granted) {
        showToast(granted ? 'Notifikasi browser aktif saat aplikasi terbuka.' : 'Browser tidak mengizinkan notifikasi. Gunakan pengingat kalender.', granted ? 'success' : 'error');
      });
      return;
    }
  }

  document.addEventListener('click', function (event) {
    Promise.resolve(handleClick(event)).catch(function (error) {
      console.error(error);
      showToast('Terjadi kendala. Coba lagi.', 'error');
    });
  });

  document.addEventListener('change', function (event) {
    const answer = event.target.closest('input[data-answer]');
    if (answer) {
      selectAnswer(answer.getAttribute('data-answer'), answer.value);
      return;
    }
    const file = event.target.closest('[data-question-file]');
    if (file && file.files && file.files[0]) {
      handleQuestionFile(file.files[0]);
    }
  });

  document.addEventListener('submit', function (event) {
    const form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    const type = form.getAttribute('data-form');
    if (type === 'login') handleLogin(form);
    if (type === 'teacher-code') saveTeacherCode(form);
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'student-search') {
      const query = event.target.value.trim().toLowerCase();
      $all('[data-student-row]').forEach(function (row) {
        row.style.display = query && row.getAttribute('data-name').indexOf(query) === -1 ? 'none' : '';
      });
    }
    if (event.target.id === 'question-search') {
      const query = event.target.value.trim().toLowerCase();
      $all('[data-question-row]').forEach(function (row) {
        row.style.display = query && row.getAttribute('data-search').indexOf(query) === -1 ? 'none' : '';
      });
    }
  });

  document.addEventListener('click', function (event) {
    const dialog = event.target.closest('dialog');
    if (dialog && event.target === dialog) closeDialog(dialog);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state.view === 'quiz' && state.attemptMode === 'exam') {
      updateTimerDisplay();
      if (remainingSeconds() <= 0) autoSubmit();
    }
  });

  window.addEventListener('beforeunload', function (event) {
    if (state.view === 'quiz' && state.attemptMode === 'exam') {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  boot();
})();

  </script>
